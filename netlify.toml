# Netlify bygger en ren udgave i dist/ (kun appens filer + samlede funktioner), så kildekode,
# README og værktøjer aldrig bliver offentlige. Samme pakke som redhue-netlify.zip til træk-og-slip.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist/netlify/functions"

# Lokal udvikling: app + funktioner på én samlet port
[dev]
  framework = "#static"
  publish = "."
  functions = "netlify/functions"
  port = 8888
  autoLaunch = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
