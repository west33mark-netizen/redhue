<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>REDHUE · Mission Control</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0a0a0d; --panel:#121217; --panel2:#18181f; --line:#26262f;
  --text:#ecebf0; --muted:#8b8a96; --red:#ff2d46; --red2:#ff6a3d;
  --ok:#3ddc97; --warn:#ffb020;
  --s-in:#3b8cff; --s-out:#e8384f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(255,45,70,.12),transparent 45%),radial-gradient(circle at 110% 20%,rgba(255,106,61,.06),transparent 40%);
  background-attachment:fixed}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.app>*{min-width:0}
aside{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:rgba(10,10,13,.6);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.brand h1{font-size:19px;letter-spacing:.14em}
.brand h1 span{color:var(--red)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.nav-btn:hover{color:var(--text);background:var(--panel)}
.nav-btn.active{color:var(--text);background:var(--panel);border-color:var(--line);box-shadow:inset 3px 0 0 var(--red)}
.nav-btn .ic{width:20px;text-align:center}
.nav-btn .pro{margin-left:auto;font-size:9px;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:1px 4px;font-family:'JetBrains Mono',monospace}
.side-foot{margin-top:auto;padding:8px;display:flex;gap:6px}
main{padding:22px 24px 100px;max-width:1180px;width:100%;margin:0 auto}
.topbar{display:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:12px 16px 110px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;position:sticky;top:0;z-index:20;background:rgba(10,10,13,.9);backdrop-filter:blur(8px)}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(12,12,16,.96);border-top:1px solid var(--line);scrollbar-width:none}
  .bottomnav::-webkit-scrollbar{display:none}
  .bottomnav .nav-btn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;min-width:64px;align-items:center;text-align:center;box-shadow:none}
  .bottomnav .nav-btn .ic{font-size:18px}
  .bottomnav .nav-btn .pro{display:none}
  .bottomnav .nav-btn.active{box-shadow:inset 0 -2px 0 var(--red)}
}
@media(min-width:861px){.bottomnav{display:none}}

/* ---------- Components ---------- */
h2.sec{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 a,.card h3 button{text-transform:none;letter-spacing:0}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--ok)} .neg{color:var(--red)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px;transition:width .4s}

button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:9px;font-size:14px;text-decoration:none;transition:.15s;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--red)}
.primary{background:linear-gradient(135deg,var(--red),var(--red2));border:none;font-weight:700;color:#fff}
.primary:disabled{opacity:.5;cursor:wait}
.small{padding:6px 10px;font-size:12px}
.ghost{background:none;border-color:transparent;color:var(--muted)}
.ghost:hover{color:var(--text)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:13px;padding:14px 0}

table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.list td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.x{background:none;border:none;color:var(--muted);padding:4px 6px;font-size:16px}
.x:hover{color:var(--red)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:14px;padding:18px}
.hero img{width:86px;height:86px;border-radius:50%;object-fit:cover;object-position:top;background:#fff;border:2px solid var(--red)}
.hero .greet{font-size:22px;font-weight:700}
.hero .meta{color:var(--muted);font-size:14px;margin-top:4px}
.robot{text-align:center}
.robot .face{font-size:40px;line-height:1}
.robot .lvl{font-size:11px;color:var(--muted);margin-top:4px}
@media(max-width:620px){.hero{grid-template-columns:auto 1fr}.robot{display:none}.hero img{width:64px;height:64px}}

/* Mission */
.days{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:12px;max-width:560px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.days i.done{background:var(--red);border-color:var(--red)}
.days i.past{background:#2a1c20}
.days i.today{outline:2px solid var(--text);outline-offset:1px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.check:last-child{border-bottom:none}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.check.on .box{background:var(--red);border-color:var(--red);color:#fff}
.check.on span{color:var(--muted);text-decoration:line-through}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;padding:4px 4px 10px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.kc .t{font-weight:500;margin-bottom:6px;word-break:break-word}
.kc .n{font-size:12px;color:var(--muted);margin-bottom:6px;white-space:pre-wrap;max-height:60px;overflow:hidden}
.kc .ctl{display:flex;gap:4px;justify-content:space-between;align-items:center}
.kc .ctl button{padding:3px 8px;font-size:12px}

/* Chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;margin-bottom:3px}

/* Agents */
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:980px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}
.agent-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;position:relative}
.agent-card:hover{transform:translateY(-2px)}
.agent-card.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 8px 30px rgba(255,45,70,.15)}
.agent-card .ico{font-size:22px;margin-bottom:6px}
.agent-card h4{font-size:15px;margin-bottom:3px}
.agent-card p{font-size:12px;color:var(--muted);line-height:1.4}
.agent-card .state{position:absolute;top:12px;right:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.agent-card .state.run{color:var(--warn)} .agent-card .state.done{color:var(--ok)}
.ag-grid{display:grid;grid-template-columns:340px 1fr;gap:12px}
@media(max-width:900px){.ag-grid{grid-template-columns:1fr}}
.output{min-height:300px;line-height:1.6;font-size:14.5px;overflow-x:auto}
.output h5{font-size:16px;margin:16px 0 6px}
.output h5:first-child{margin-top:0}
.output strong{color:#fff}
.output ul,.output ol{padding-left:20px;margin:4px 0}
.output p{margin:4px 0}
.output table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.output th,.output td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.output th{background:var(--panel2)}
.loader{display:flex;gap:6px;justify-content:center;padding-top:60px}
.loader i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:b 1s infinite}
.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-8px);opacity:.4}}
.err{color:var(--red);font-size:14px;padding:10px;border:1px solid var(--red);border-radius:9px;background:rgba(255,45,70,.07)}
.lock{text-align:center;padding:26px 16px}
.lock .big{font-size:34px;margin-bottom:8px}
.chain{margin-top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.chain input{width:auto}
.hist-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.hist-item:hover{color:var(--red)}
.hist-item span:last-child{color:var(--muted);font-size:11px;white-space:nowrap}

.feed{font-size:13px}
.feed div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.feed div:last-child{border:none}
.feed span:last-child{color:var(--muted);white-space:nowrap}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--red);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.xp-pop{position:fixed;top:18px;right:18px;background:var(--red);color:#fff;font-weight:700;padding:6px 12px;border-radius:99px;font-size:13px;opacity:0;transform:translateY(-8px);transition:.25s;z-index:60}
.xp-pop.show{opacity:1;transform:none}
.section{display:none}
.section.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* =========================================================
   CRYSTAL INTERFACE  (farve- og glaslag oven på basis-designet)
   ========================================================= */
:root{
  --bg:#06060e; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
  --text:#f2f1f8; --muted:#9a98b0;
  --cy:#3ee8ff; --bl:#4d8dff; --vi:#9b6bff; --ma:#ff4fd8; --red:#ff2d46; --red2:#ff7a3d; --am:#ffc247; --ok:#3ddc97; --warn:#ffc247;
  --s-in:#3ee8ff; --s-out:#ff4fd8;
  --crystal:linear-gradient(120deg,var(--cy),var(--vi) 45%,var(--ma) 75%,var(--red));
  --glass:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 60%);
  --acc:var(--vi);
}
html,body{background:var(--bg)}
body{background:transparent;background-image:none}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px) saturate(150%);opacity:1;
  background:
    radial-gradient(38% 32% at 12% 8%,rgba(62,232,255,.30),transparent 70%),
    radial-gradient(34% 30% at 88% 12%,rgba(255,79,216,.26),transparent 70%),
    radial-gradient(40% 36% at 70% 88%,rgba(155,107,255,.30),transparent 70%),
    radial-gradient(30% 28% at 18% 85%,rgba(255,45,70,.20),transparent 70%);
  animation:aurora 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
@keyframes aurora{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(8deg)}100%{transform:translate(-3%,3%) rotate(-6deg)}}

/* Glas-flader */
.card,.col,.agent-card{background:var(--glass),rgba(14,14,28,.45);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.02),0 12px 36px -12px rgba(0,0,0,.6);
  position:relative;overflow:hidden;overflow:clip;border-radius:18px}
.card::before,.col::before,.agent-card::before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.9;pointer-events:none}
.card::after,.agent-card::after{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-80px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%);pointer-events:none}
.card>*,.agent-card>*{position:relative;z-index:1}
.card:hover{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}

/* Farve pr. kort (nøgletal m.m.) */
.grid>.card:nth-child(6n+1){--acc:var(--cy)}
.grid>.card:nth-child(6n+2){--acc:var(--vi)}
.grid>.card:nth-child(6n+3){--acc:var(--ma)}
.grid>.card:nth-child(6n+4){--acc:var(--am)}
.grid>.card:nth-child(6n+5){--acc:var(--ok)}
.grid>.card:nth-child(6n+6){--acc:var(--bl)}
.hero{--acc:var(--ma)}
.av-ini{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font:700 34px 'Space Grotesk',sans-serif;color:#08081a;background:var(--crystal);box-shadow:0 0 24px -4px var(--ma);flex:none;user-select:none}
@media(max-width:620px){.av-ini{width:64px;height:64px;font-size:26px}}
.av-set{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.av-set .av-ini,.av-set img{width:64px;height:64px;font-size:26px;border-radius:50%;object-fit:cover;object-position:top}
.av-set img{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--crystal) border-box}
.kpi .v{color:var(--acc);text-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent)}
.kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--ma)}
.card h3{color:color-mix(in srgb,var(--acc) 55%,var(--muted))}

/* Sidebar + brand */
aside{background:linear-gradient(180deg,rgba(20,18,40,.55),rgba(8,8,18,.55));border-right:1px solid var(--line);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.brand .dot{background:conic-gradient(var(--cy),var(--vi),var(--ma),var(--red),var(--am),var(--cy));box-shadow:0 0 16px var(--vi),0 0 30px rgba(62,232,255,.4);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1 span{background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Menu – hver sektion sin farve */
.nav-btn[data-go="overview"]{--acc:var(--cy)}
.nav-btn[data-go="mission"]{--acc:var(--ma)}
.nav-btn[data-go="pipeline"]{--acc:var(--vi)}
.nav-btn[data-go="agents"]{--acc:var(--bl)}
.nav-btn[data-go="wallet"]{--acc:var(--ok)}
.nav-btn[data-go="portfolio"]{--acc:var(--am)}
.nav-btn[data-go="products"]{--acc:var(--red)}
.nav-btn[data-go="settings"]{--acc:#b9b7cc}
.nav-btn{border-radius:12px;transition:.18s}
.nav-btn .ic{color:var(--acc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 60%,transparent))}
.nav-btn:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.nav-btn.active{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 24%,transparent),color-mix(in srgb,var(--acc) 4%,transparent));
  border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:inset 3px 0 0 var(--acc),0 0 22px -6px var(--acc)}
.nav-btn .pro{border-color:var(--bl);color:var(--bl)}
.topbar{background:rgba(8,8,18,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@media(max-width:860px){
  .bottomnav{background:rgba(10,10,22,.7);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-top:1px solid var(--line)}
  .bottomnav .nav-btn.active{box-shadow:inset 0 -2px 0 var(--acc),0 0 18px -6px var(--acc)}
}

/* Overskrifter */
h2.sec{background:linear-gradient(90deg,#fff 30%,color-mix(in srgb,var(--vi) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Knapper + felter */
button,.btn{background:rgba(255,255,255,.06);border-color:var(--line);border-radius:11px;backdrop-filter:blur(8px)}
button:hover,.btn:hover{border-color:color-mix(in srgb,var(--vi) 60%,transparent);box-shadow:0 0 16px -6px var(--vi)}
.primary{background:var(--crystal);background-size:200% 100%;border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  box-shadow:0 6px 22px -8px var(--ma),inset 0 1px 0 rgba(255,255,255,.35);transition:background-position .4s,transform .15s}
.primary:hover{background-position:100% 0;transform:translateY(-1px);box-shadow:0 10px 26px -8px var(--vi),inset 0 1px 0 rgba(255,255,255,.35)}
.ghost{background:none;box-shadow:none;backdrop-filter:none}
input,textarea,select{background:rgba(0,0,0,.28);border-color:var(--line);border-radius:11px}
input:focus,textarea:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(62,232,255,.15)}

/* Fremdrift */
.bar{background:rgba(255,255,255,.07)}
.bar i{background:var(--crystal);box-shadow:0 0 14px rgba(155,107,255,.6)}

/* ---------- Chart: In vs Out, last 6 months ---------- */
function monthly(){
  const out=[]; const [ty,tm]=today().split("-").map(Number);
  for(let i=5;i>=0;i--){
    const m=new Date(ty, tm-1-i, 1); const key=ymd(m).slice(0,7);
    const rows=S.wallet.filter(w=>w.date.slice(0,7)===key);
    out.push({ label:m.toLocaleDateString(lang==="da"?"da-DK":"en-GB",{month:"short"}), key,
      in:rows.filter(r=>r.type==="in").reduce((a,r)=>a+ +r.amount,0),
      out:rows.filter(r=>r.type==="out").reduce((a,r)=>a+ +r.amount,0) });
  }
  return out;
}
function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function drawChart(el){
  const data=monthly(), W=560, H=220, L=48, R=8, Tp=10, B=26;
  const max=niceMax(Math.max(...data.flatMap(d=>[d.in,d.out])));
  const cw=(W-L-R)/data.length, bw=Math.min(18,(cw-14)/2);
  const y=v=>Tp+(H-Tp-B)*(1-v/max);
  let g="";
  for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${yy+4}" fill="#9a98b0" font-size="11" text-anchor="end" font-family="JetBrains Mono">${abbr(v)}</text>`; }
  const bar=(x,v,c)=>{ if(v<=0) return ""; const top=y(v), h=(H-B)-top, r=Math.min(4,h);
    return `<path d="M${x},${H-B} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${H-B} Z" fill="${c}"/>`; };
  data.forEach((d,i)=>{
    const cx=L+cw*i+cw/2;
    g+=bar(cx-bw-1,d.in,"var(--s-in)")+bar(cx+1,d.out,"var(--s-out)");
    g+=`<text x="${cx}" y="${H-8}" fill="#9a98b0" font-size="11" text-anchor="middle">${esc(d.label)}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${L+cw*i}" y="${Tp}" width="${cw}" height="${H-Tp-B}" fill="transparent"/>`;
  });
  el.innerHTML = `<div class="legend"><span><i style="background:var(--s-in)"></i>${t().legendIn}</span><span><i style="background:var(--s-out)"></i>${t().legendOut}</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t().last6)}">${g}</svg><div class="tip"></div></div>`;
  const tip=el.querySelector(".tip"), wrap=el.querySelector(".chart");
  el.querySelectorAll(".hit").forEach(h=>{
    const show=()=>{ const d=data[+h.dataset.i]; h.setAttribute("fill","rgba(255,255,255,.04)");
      tip.innerHTML=`<b>${esc(d.label)}</b><span style="color:var(--muted)">${t().legendIn}</span> ${money(d.in)}<br><span style="color:var(--muted)">${t().legendOut}</span> ${money(d.out)}<br><span style="color:var(--muted)">Netto</span> ${money(d.in-d.out)}`;
      const r=h.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
      tip.style.left=Math.min(wr.width-150, Math.max(0, r.left-wr.left+r.width/2-70))+"px"; tip.style.top="0px"; tip.style.opacity=1; };
    const hide=()=>{ h.setAttribute("fill","transparent"); tip.style.opacity=0; };
    h.addEventListener("mouseenter",show); h.addEventListener("mouseleave",hide);
    h.addEventListener("touchstart",show,{passive:true});
  });
}
function abbr(v){ return v>=1e6? (v/1e6).toFixed(1).replace(".0","")+"M" : v>=1e3? (v/1e3).toFixed(v%1000?1:0).replace(".0","")+"k" : Math.round(v); }

/* ---------- Blide stemmer: tekst til tale med telefonens egne stemmer ----------
   Gratis og privat (Web Speech API, intet forlader telefonen). Roligt tempo og blød tone,
   egen stemme pr. figur. Emojis, markdown og lister fjernes før oplæsning. */
const Voice=(()=>{
  const KEY="redhue_voice", ss=window.speechSynthesis;
  const ok=!!(ss&&window.SpeechSynthesisUtterance);
  const cfg=()=>{ const c=Object.assign({on:true,rate:.9,voices:{},auto:"answers",quiet:true},store.get(KEY,{}));
    if(c.auto===true) c.auto="answers"; if(c.auto===false) c.auto="off"; if(!["off","answers","all"].includes(c.auto)) c.auto="answers"; return c; };
  const TONE={mom:{pitch:1.08},dad:{pitch:.86},mentor:{pitch:.98},coach:{pitch:1},guide:{pitch:1.04}};
  const FEM=/female|kvinde|woman|frau|sara|helle|naja|ida|christel|pernille|freja|tilde|zira|samantha|karen|susan|serena|tessa|fiona|victoria|moira|allison|ava|kate|jenny|aria|emma/i;
  const MAL=/male|mand|man\b|magnus|jeppe|mads|carsten|daniel|alex|fred|tom|george|guy|ryan|david|mark|thomas|lee|oliver/i;
  let current=null, curBtn=null;
  const all=()=>ok?ss.getVoices():[];
  const forLang=()=>{ const l=lang==="en"?"en":"da"; const v=all().filter(x=>(x.lang||"").toLowerCase().startsWith(l)); return v.length?v:all(); };
  function auto(role){ const v=forLang(); if(!v.length) return null;
    const want=role==="mom"?FEM:role==="dad"?MAL:null;
    const score=x=>(want&&want.test(x.name)?4:0)+(want&&!want.test(x.name)&&(role==="mom"?MAL:FEM).test(x.name)?-3:0)+(/natural|neural|premium|enhanced|google/i.test(x.name)?2:0)+(x.localService?1:0);
    return v.slice().sort((a,b)=>score(b)-score(a))[0]; }
  function voiceFor(role){ const uri=cfg().voices[role]; return (uri&&all().find(v=>v.voiceURI===uri))||auto(role); }
  function clean(s){
    // Blokke (punkter, afsnit, linjeskift) bliver til pauser, så lister ikke læses i ét hug
    const html=String(s||"").replace(/<\/(li|p|h[1-6]|div|ol|ul)>|<br\s*\/?>/gi,". ");
    const d=document.createElement("div"); d.innerHTML=html; let t=d.textContent||"";
    t=t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,"").replace(/[*_#`>|]/g,"")
      .replace(/(^|[.!?]\s+)[-•]\s+/g,"$1").replace(/(^|[.!?]\s+)\d+[.)]\s+/g,"$1").replace(/\n+/g,". ")
      .replace(/\s*[–—]\s*/g,", ").replace(/([.!?])\s*[,.]+/g,"$1").replace(/\s+([,.!?])/g,"$1").replace(/^[,.\s]+/,"").replace(/\s+/g," ").trim();
    return t; }
  function stop(){ if(ok) ss.cancel(); if(curBtn){ curBtn.classList.remove("on"); curBtn.title=t().voPlay; } current=null; curBtn=null; }
  function speak(text,role="mentor",btn){
    if(!ok) return;
    if(btn&&curBtn===btn){ stop(); return; }
    stop(); const s=clean(text); if(!s) return;
    const u=new SpeechSynthesisUtterance(s), v=voiceFor(role), c=cfg();
    u.lang=(v&&v.lang)||(lang==="en"?"en-GB":"da-DK"); if(v){ try{ u.voice=v; }catch{} }
    u.rate=Math.min(1.1,Math.max(.7,+c.rate||.9)); u.pitch=(TONE[role]||TONE.mentor).pitch; u.volume=.95;
    u.onend=u.onerror=()=>{ if(current===u) stop(); };
    current=u; if(btn){ curBtn=btn; btn.classList.add("on"); btn.title=t().voStop; }
    ss.speak(u); }
  const btn=(role)=>ok&&cfg().on?`<button type="button" class="say" data-say="${role}" title="${esc(t().voPlay)}" aria-label="${esc(t().voPlay)}">🔊</button>`:"";
  // Én lytter for alle 🔊-knapper: læser teksten i den boble, knappen sidder i
  document.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(!b) return; e.stopPropagation();
    const box=b.closest(".ch-msg,.gd-m,.os-w"); if(!box) return; const c=box.cloneNode(true); c.querySelectorAll(".say,.nt,.lbl,.who").forEach(x=>x.remove());
    speak(c.innerHTML,b.dataset.say,b); },true);
  /* ---------- Automatisk oplæsning ----------
     Niveauer: "off" · "answers" (coach, mor/far, guide) · "all" (også beskeder, fejringer og dagens hilsen).
     Taler aldrig i stilletid (22–07), aldrig når appen er skjult, og venter på første tryk
     (telefoner tillader ikke lyd, før man har rørt skærmen). Automatiske beskeder venter i kø
     og afbryder ikke hinanden; tryk på 🔊 eller Tal afbryder altid. */
  let unlocked=false; const q=[]; let qBusy=false;
  const quietNow=()=>{ if(!cfg().quiet) return false; const h=nowHour(); return h>=22||h<7; };
  const level=()=>ok&&cfg().on?cfg().auto:"off";
  function wants(kind){ const l=level(); if(l==="off") return false; return kind==="answer"?true:l==="all"; }
  function pump(){
    if(qBusy||!q.length||!unlocked||document.hidden) return;
    if(ss.speaking||ss.pending||curBtn){ setTimeout(pump,800); return; }
    const it=q.shift(); qBusy=true; const before=current;
    speak(it.text,it.role);
    const u=current; if(!u||u===before){ qBusy=false; setTimeout(pump,200); return; }
    const done=()=>{ qBusy=false; setTimeout(pump,350); }; const prev=u.onend; u.onend=u.onerror=()=>{ try{ prev&&prev(); }catch(e){} done(); };
  }
  function autoSay(text,role="mentor",kind="answer"){
    if(!wants(kind)||quietNow()) return false;
    const s=clean(text); if(!s) return false;
    if(q.some(x=>x.s===s)) return false;
    if(kind!=="answer"&&q.length>=3) return false;
    if(kind==="answer"){ for(let i=q.length-1;i>=0;i--) if(q[i].kind!=="answer") q.splice(i,1); }
    q.push({text,role,kind,s}); setTimeout(pump,60); return true;
  }
  const unlock=()=>{ if(unlocked) return; unlocked=true;
    try{ if(ok){ const u=new SpeechSynthesisUtterance(" "); u.volume=0; ss.speak(u); } }catch(e){}
    setTimeout(pump,250); };
  ["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlock,{once:true,capture:true,passive:true}));
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) q.length=0; });
  // Dagens hilsen fra mor/far/mentor – én gang om dagen ved første tryk
  function daily(){ if(!wants("all")) return; const k="redhue_voice_day"; if(store.get(k,"")===today()) return;
    try{ const lb=Parent.label(); const n=Parent.note(); if(!n) return; store.set(k,today());
      autoSay((lang==="en"?"Good to see you. ":"Godt at se dig. ")+n+" – "+lb.name, Parent.cfg?Parent.cfg().role:"mom","all"); }catch(e){} }
  const pname=()=>{ try{ return Parent.label().name; }catch(e){ return lang==="en"?"mom":"mor"; } };
  function renderSettings(){

    $("voQuiet").checked=c.quiet!==false; $("voQuietL").textContent=LL("Stille kl. 22–07","Quiet 22–07");

  $("voBtn").onclick=()=>{ const c=cfg(); c.on=!c.on; store.set(KEY,c); stop(); renderSettings(); if(window.Talk) Talk.refresh(); };
  $("voAutoSeg").onclick=e=>{ const b=e.target.closest("[data-voauto]"); if(!b) return; const c=cfg(); c.auto=b.dataset.voauto; store.set(KEY,c); renderSettings(); if(c.auto!=="off"){ unlocked=true; autoSay(lang==="en"?"Automatic reading is on.":"Automatisk oplæsning er slået til.","guide","answer"); } };
  $("voQuiet").onchange=()=>{ const c=cfg(); c.quiet=$("voQuiet").checked; store.set(KEY,c); };
  $("voRate").oninput=()=>{ const c=cfg(); c.rate=+$("voRate").value; store.set(KEY,c); $("voRateV").textContent=c.rate.toFixed(2)+"×"; };
  $("voRows").addEventListener("change",e=>{ const s=e.target.closest("[data-vo]"); if(!s) return; const c=cfg(); if(s.value) c.voices[s.dataset.vo]=s.value; else delete c.voices[s.dataset.vo]; store.set(KEY,c); });
  $("voRows").addEventListener("click",e=>{ const b=e.target.closest("[data-votest]"); if(b) speak(t().voSample,b.dataset.votest,b); });
  if(ok&&ss.addEventListener) ss.addEventListener("voiceschanged",()=>{ if(current==="settings") renderSettings(); });
  addEventListener("pagehide",stop); document.addEventListener("visibilitychange",()=>{ if(document.hidden) stop(); });
  return { speak, stop, btn, renderSettings, clean, available:()=>ok, on:()=>cfg().on, auto:()=>wants("answer")&&!quietNow(), autoSay, daily, level };

/* ---------- Tryghed: SOS, frivillig positionsdeling, andre med appen, find mine enheder ----------
   Samtykke først: intet spores eller deles uden brugerens eget tryk på sin egen enhed.
   Web-apps kan kun bruge GPS, mens appen er åben. REDHUE erstatter ikke 112. */
const Safe=(()=>{
  const API=apiUrl("/api/safe"), K_DEV="redhue_device", K_EC="redhue_ec", K_SH="redhue_shares", K_W="redhue_watch", K_FD="redhue_findable";
  const L=()=>t(), loc=()=>lang==="da"?"da-DK":"en-GB";
  function devKey(){ let k=store.get(K_DEV,""); if(!/^[a-f0-9]{40}$/.test(k)){ k=[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,"0")).join(""); store.set(K_DEV,k); } return k; }
  async function api(body){ const headers={"content-type":"application/json","x-device":devKey()}; if(store.get(K.lic,"")) headers["x-license"]=store.get(K.lic,"");
    if(!Net.online()) return {ok:false,status:0,j:{error:"offline"}};
    const r=await Net.tfetch(API,{method:"POST",headers,body:JSON.stringify(body)},12000); const j=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,j}; }
  let lastPos=null, watchId=null, lastSent=0, timer=null;
  function getPos(timeout=10000){ return new Promise(res=>{ if(!navigator.geolocation) return res(lastPos);
    navigator.geolocation.getCurrentPosition(p=>{ lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; res(lastPos); },()=>res(lastPos),{enableHighAccuracy:true,timeout,maximumAge:30000}); }); }
  const mapUrl=p=>`https://maps.google.com/?q=${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
  const liveUrl=c=>`${APP_URL}#safe?view=${c}`;
  const clockNow=()=>new Date().toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:TZ()}).replace(".",":");
  function ago(ts){ const s=(Date.now()-ts)/1000, X=L(); return s<60?X.agoNow:s<3600?X.agoMin(Math.round(s/60)):s<86400?X.agoH(Math.round(s/3600)):X.agoD(Math.round(s/86400)); }
  function left(exp){ const m=Math.max(0,Math.round((exp-Date.now())/60000)), X=L(); return m<60?X.minLeft(m):X.hLeft(Math.round(m/60)); }
  const myShares=()=>store.get(K_SH,[]).filter(s=>s.exp>Date.now());
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
  const smsHref=(nums,text)=>`sms:${nums.join(",")}${isIOS()?"&":"?"}body=${encodeURIComponent(text)}`;

  // --- Live-opdatering, mens appen er åben og der er aktive delinger eller "kan findes" ---
  function needLive(){ return myShares().length>0 || (store.get(K_FD,{}).on && hasLic()); }
  function startLive(){ if(watchId!==null||!navigator.geolocation||!needLive()) return;
    watchId=navigator.geolocation.watchPosition(p=>{ lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; push(); },()=>{},{enableHighAccuracy:true,maximumAge:30000,timeout:20000});
    clearInterval(timer); timer=setInterval(push,120000); }
  function stopLive(){ if(watchId!==null&&navigator.geolocation) navigator.geolocation.clearWatch(watchId); watchId=null; clearInterval(timer); timer=null; }
  async function push(force){ if(!lastPos||document.hidden) return; if(!force&&Date.now()-lastSent<30000) return; lastSent=Date.now();
    for(const s of myShares()){ const r=await api({action:"share_update",code:s.code,pos:lastPos}).catch(()=>null); if(r&&(r.status===404||r.j.stopped)) dropShare(s.code); }
    const fd=store.get(K_FD,{}); if(fd.on&&hasLic()){ let bat=null; try{ if(navigator.getBattery){ const b=await navigator.getBattery(); bat=Math.round(b.level*100); } }catch{} api({action:"ping",name:fd.name||defaultName(),pos:lastPos,battery:bat,findable:true}).catch(()=>{}); }
    indicators(); }
  function dropShare(code){ store.set(K_SH,store.get(K_SH,[]).filter(s=>s.code!==code)); if(!needLive()) stopLive(); indicators(); }
  function indicators(){ const on=myShares().length>0; ["osLoc","shPill"].forEach(id=>{ const e=$(id); if(e) e.hidden=!on; }); }

  // --- SOS: hold 2 sek. ---
  let holdT=null;
  function holdStart(e){ if(e&&e.button>0) return; e&&e.preventDefault(); const b=$("sosBtn"); b.classList.add("hold"); buzz(15); holdT=setTimeout(()=>{ b.classList.remove("hold"); trigger(); },2000); }
  function holdEnd(){ clearTimeout(holdT); holdT=null; $("sosBtn").classList.remove("hold"); }
  async function trigger(){
    buzz([200,80,200,80,400]); const X=L(), out=$("sosOut"); out.hidden=false; out.innerHTML=`<b>${esc(X.sosGetting)}</b>`;
    const pos=await getPos(9000), nm=(S.profile.name||"").trim()||"REDHUE";
    let code=null; try{ const r=await api({action:"share_start",name:nm,sos:true,pos}); if(r.ok){ code=r.j.code; store.set(K_SH,myShares().concat({code,exp:r.j.exp,label:"SOS",sos:true})); startLive(); } }catch{}
    const text=X.sosMsg(nm, pos?`${mapUrl(pos)} (±${pos.acc} m)`:"", clockNow(), code?liveUrl(code):"");
    const ec=store.get(K_EC,[]), nums=ec.map(c=>c.phone.replace(/[^\d+]/g,"")).filter(Boolean);
    out.innerHTML=`${Net.online()?"":`<p style="margin:0 0 8px;color:var(--am,#ffc247)">${esc(lang==="en"?"No internet – SMS and 112 still work over the phone network. Your position from GPS is in the message.":"Intet internet – SMS og 112 virker stadig over telefonnettet. Din GPS-position står i beskeden.")}</p>`}${pos?"":`<p style="margin:0 0 8px;color:var(--red)">${esc(X.sosNoPos)}</p>`}<p style="margin:0 0 6px">${esc(nums.length?X.sosReady:X.sosNoContacts)}</p>
      <div class="mono" style="font-size:12.5px;color:var(--muted);overflow-wrap:anywhere" id="sosText">${esc(text)}</div>
      <div class="actions">${nums.length?`<a class="btn primary" id="sosSms" href="${esc(smsHref(nums,text))}">${esc(X.sosSms(nums.length))}</a>`:""}
        <a class="btn" id="sosWa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${esc(X.waBtn)}</a>
        ${navigator.share?`<button id="sosShare">${esc(X.shareBtn)}</button>`:""}<button id="sosCopy">${esc(X.copyBtn)}</button>
        <a class="call112" href="tel:112">📞 ${esc(X.call112)}</a>${code?`<button class="small" id="sosStop">${esc(X.sosStop)}</button>`:""}</div>`;
    $("sosCopy").onclick=()=>copy(text); if($("sosShare")) $("sosShare").onclick=()=>navigator.share({text}).catch(()=>{});
    if($("sosStop")) $("sosStop").onclick=async()=>{ await api({action:"share_stop",code}).catch(()=>{}); dropShare(code); out.hidden=true; toast(X.sosStopped); render(); };
    render(); }
  function copy(text){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(L().copied)).catch(()=>{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(L().copied); }catch{} ta.remove(); }); }

  // --- Sundhed i Danmark: numre pr. region (tjekket nov. 2026, Sundhedsstyrelsen) ---
  const LV={hovedstaden:"1813",sjaelland:"1818",syddanmark:"70 11 07 07",midtjylland:"70 11 31 31",nordjylland:"70 15 03 00"};
  function renderHealth(){ const X=L(), r=store.get("redhue_region",""), tel=n=>"tel:"+n.replace(/\s/g,"");
    $("hlRegion").innerHTML=`<option value="">${esc(X.hlPick)}</option>`+Object.entries(X.hlRegions).map(([k,v])=>`<option value="${k}" ${r===k?"selected":""}>${esc(v)}</option>`).join("");
    const row=(ic,[t1,t2],num,cls)=>`<a class="hl-row ${cls||""}" ${num?`href="${tel(num)}"`:""}><span class="ic">${ic}</span><span><b>${esc(t1)}</b><small>${esc(t2)}</small></span><span class="num">${esc(num||"")}</span></a>`;
    $("hlList").innerHTML=row("🚨",X.hl112,"112","red")+(r?row("🩺",[X.hlLv[0]+" · "+X.hlRegions[r].replace(/^Region /,""),X.hlLv[1]],LV[r]):row("🩺",[X.hlLv[0],X.hlLvPick],""))+row("☠️",X.hlGift,"82 12 12 12")+row("💜",X.hlLiv,"70 201 201"); }
  $("hlRegion").onchange=()=>{ store.set("redhue_region",$("hlRegion").value); renderHealth(); };
  function lvNumber(){ const r=store.get("redhue_region",""); return r?{num:LV[r],region:L().hlRegions[r]}:null; }

  // --- Visning ---
  const defaultName=()=>/android/i.test(navigator.userAgent)?(lang==="en"?"Android phone":"Android-telefon"):/iphone/i.test(navigator.userAgent)?"iPhone":/ipad/i.test(navigator.userAgent)?"iPad":(lang==="en"?"Computer":"Computer");
  async function render(){
    const X=L(), ec=store.get(K_EC,[]);
    $("ecList").innerHTML=ec.length?ec.map((c,i)=>`<div class="sf-item"><span><b>${esc(c.name)}</b> <span class="m">${esc(c.phone)}</span></span><div class="acts"><a class="btn small" href="tel:${esc(c.phone.replace(/[^\d+]/g,""))}">📞</a><button class="small" data-ecdel="${i}">${esc(X.remove)}</button></div></div>`).join(""):`<div class="m" style="color:var(--muted);font-size:14px">${esc(X.ecNone)}</div>`;
    const sh=myShares();
    $("shList").innerHTML=sh.length?sh.map(s=>`<div class="sf-item"><span>${s.sos?`<span class="sosb">SOS</span> `:""}${esc(X.shActive(s.sos?"":s.label,left(s.exp)))}</span><div class="acts"><button class="small" data-shcopy="${esc(s.code)}">${esc(X.copyBtn)}</button>${navigator.share?`<button class="small" data-shshare="${esc(s.code)}">${esc(X.shareBtn)}</button>`:""}<button class="small" data-shstop="${esc(s.code)}">${esc(X.stop)}</button></div></div>`).join(""):`<div style="color:var(--muted);font-size:14px">${esc(X.shNone)}</div>`;
    indicators(); renderHealth(); renderWatch(); renderDevices(); }
  async function renderWatch(){ const X=L(), w=store.get(K_W,[]);
    if(!w.length){ $("wList").innerHTML=`<div style="color:var(--muted);font-size:14px">${esc(X.wNone)}</div>`; return; }
    const rows=await Promise.all(w.map(async it=>{ try{ const r=await api({action:"view",code:it.code}); return {it,r}; }catch{ return {it,r:null}; } }));
    $("wList").innerHTML=rows.map(({it,r})=>{ const d=r&&r.ok?r.j:null;
      if(!d) return `<div class="sf-item"><span><b>${esc(it.name||it.code)}</b> <span class="m">${esc(X.wExpired)}</span></span><div class="acts"><button class="small" data-wdel="${esc(it.code)}">${esc(X.remove)}</button></div></div>`;
      if(d.name&&d.name!==it.name){ it.name=d.name; store.set(K_W,w); }
      return `<div class="sf-item"><span>${d.sos?`<span class="sosb">SOS</span> `:""}<b>${esc(d.name)}</b><br><span class="m">${esc(X.wAgo(d.pos?`±${d.pos.acc} m`:"–",ago(d.ts)))}</span></span><div class="acts">${d.pos?`<a class="btn small" href="${esc(mapUrl(d.pos))}" target="_blank" rel="noopener">${esc(X.openMap)}</a>`:""}<button class="small" data-wdel="${esc(it.code)}">${esc(X.remove)}</button></div></div>`; }).join(""); }
  async function renderDevices(){ const X=L(), fd=store.get(K_FD,{});
    if(!hasLic()){ $("fdBody").innerHTML=`<div style="color:var(--muted);font-size:14px">${esc(X.fdPro)}</div>`; return; }
    $("fdBody").innerHTML=`<label style="display:flex;gap:8px;align-items:center;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)"><input type="checkbox" id="fdOn" ${fd.on?"checked":""} style="width:auto"> ${esc(X.fdThis)}</label>
      <div class="pgoal-row" style="margin-top:8px"><div><label>${esc(X.fdName)}</label><input id="fdName" maxlength="30" value="${esc(fd.name||defaultName())}"></div><button id="fdSave">${esc(t().save)}</button></div><div class="sf-list" id="fdList"></div>`;
    $("fdOn").onchange=async()=>{ const v=$("fdOn").checked; store.set(K_FD,{on:v,name:$("fdName").value.trim()||defaultName()});
      if(v){ await getPos(8000); startLive(); await push(true); } else { await api({action:"ping",findable:false}).catch(()=>{}); if(!needLive()) stopLive(); } renderDevices(); };
    $("fdSave").onclick=()=>{ store.set(K_FD,Object.assign({},store.get(K_FD,{}),{name:$("fdName").value.trim().slice(0,30)})); toast(t().saved); push(true); };
    try{ const r=await api({action:"devices"}); const list=r.ok?r.j.devices:[];
      $("fdList").innerHTML=list.length?list.map(d=>`<div class="sf-item"><span><b>${esc(d.name)}</b>${d.me?` <span class="m">(${esc(X.fdThisTag)})</span>`:""}<br><span class="m">${esc(ago(d.ts))}${d.battery!=null?` · 🔋 ${d.battery}%`:""}${d.pos?` · ±${d.pos.acc} m`:""}</span></span><div class="acts">${d.pos?`<a class="btn small" href="${esc(mapUrl(d.pos))}" target="_blank" rel="noopener">${esc(X.openMap)}</a>`:""}<button class="small" data-fdforget="${esc(d.id)}">${esc(X.fdForget)}</button></div></div>`).join(""):`<div style="color:var(--muted);font-size:14px">${esc(X.fdNone)}</div>`;
    }catch{} }
  function addWatch(raw){ const m=String(raw||"").trim().match(/(?:view=)?([a-z0-9]{8,20})\s*$/i); if(!m) { toast(L().wBad); return false; }
    const code=m[1].toLowerCase(), w=store.get(K_W,[]); if(!w.some(x=>x.code===code)) w.push({code,name:""}); store.set(K_W,w); return true; }

  // --- Hændelser ---
  const sb=$("sosBtn");
  sb.addEventListener("pointerdown",holdStart); ["pointerup","pointerleave","pointercancel"].forEach(ev=>sb.addEventListener(ev,holdEnd));
  sb.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!holdT&&!e.repeat) holdStart(e); });
  sb.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") holdEnd(); });
  sb.addEventListener("contextmenu",e=>e.preventDefault());
  $("osSos").onclick=()=>{ go("safe"); setTimeout(()=>$("sosBtn").focus(),200); };
  $("ecForm").onsubmit=e=>{ e.preventDefault(); const name=$("ecName").value.trim(), phone=$("ecPhone").value.trim(); if(!name||!/[\d]{4,}/.test(phone.replace(/\D/g,""))) return;
    store.set(K_EC,store.get(K_EC,[]).concat({name:name.slice(0,30),phone:phone.slice(0,20)}).slice(0,10)); $("ecName").value=""; $("ecPhone").value=""; render(); };
  $("ecList").addEventListener("click",e=>{ const b=e.target.closest("[data-ecdel]"); if(!b) return; const ec=store.get(K_EC,[]); ec.splice(+b.dataset.ecdel,1); store.set(K_EC,ec); render(); });
  $("shForm").onsubmit=async e=>{ e.preventDefault(); const X=L(), pos=await getPos(9000), nm=(S.profile.name||"").trim()||"REDHUE";
    try{ const r=await api({action:"share_start",name:nm,hours:+$("shHours").value,pos}); if(!r.ok) return toast(r.j.error==="too_many_shares"?"Max 5":t().errors.default);
      const label=$("shLabel").value.trim().slice(0,30); store.set(K_SH,myShares().concat({code:r.j.code,exp:r.j.exp,label})); $("shLabel").value=""; startLive(); render();
      const msg=X.shMsg(nm,liveUrl(r.j.code)); if(navigator.share) navigator.share({text:msg}).catch(()=>copy(msg)); else copy(msg);
    }catch{ toast(t().errors.network); } };
  $("shList").addEventListener("click",async e=>{ const b=e.target.closest("[data-shstop],[data-shcopy],[data-shshare]"); if(!b) return; const X=L(), nm=(S.profile.name||"").trim()||"REDHUE";
    if(b.dataset.shstop){ await api({action:"share_stop",code:b.dataset.shstop}).catch(()=>{}); dropShare(b.dataset.shstop); render(); }
    else if(b.dataset.shcopy) copy(X.shMsg(nm,liveUrl(b.dataset.shcopy)));
    else navigator.share({text:X.shMsg(nm,liveUrl(b.dataset.shshare))}).catch(()=>{}); });
  $("wAddForm").onsubmit=e=>{ e.preventDefault(); if(addWatch($("wCode").value)){ $("wCode").value=""; toast(L().wAdded); renderWatch(); } };
  $("wList").addEventListener("click",e=>{ const b=e.target.closest("[data-wdel]"); if(!b) return; store.set(K_W,store.get(K_W,[]).filter(x=>x.code!==b.dataset.wdel)); renderWatch(); });
  $("fdBody").addEventListener("click",async e=>{ const b=e.target.closest("[data-fdforget]"); if(!b) return; await api({action:"forget",id:b.dataset.fdforget}).catch(()=>{}); renderDevices(); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(needLive()) { startLive(); push(true); } if(current==="safe") render(); } });
  setInterval(()=>{ if(current==="safe"&&!document.hidden) renderWatch(); },30000);
  // Åbnet via et delingslink → tilføj til "Andre med appen"
  if(SAFE_VIEW){ addWatch(SAFE_VIEW); history.replaceState(null,"",location.pathname+location.search+"#safe"); }
  if(needLive()) startLive(); indicators();
  return { render, trigger, addWatch, getPos, myShares, indicators, lvNumber };
})();

/* ---------- Tal-knap: appen fortæller med dine egne tal, hvad du ser ---------- */
window.Talk=null;
const Talk=(()=>{
  const T=()=>t().talk;
  function sentences(id){
    const L=t(), K=T(), out=[], h=nowHour(), loc=lang==="da"?"da-DK":"en-GB", now=new Date();
    const clock=now.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:TZ()}).replace(".",":");
    const date=now.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",timeZone:TZ()});
    const done=(S.mission.checks[today()]||[]).filter(Boolean).length, P=profitNow(), D=Math.min(missionDay(),90);
    const nm=(S.profile.name||"").trim(), hi=(h<10?K.hiM:h<18?K.hiD:K.hiE)+(nm?" "+nm:"")+".";
    const leftTasks=()=>{ const c=S.mission.checks[today()]||[]; const l=L.checks.filter((x,i)=>!c[i]); return l.length&&l.length<4?K.left(l.join(", ")):""; };
    const profitLine=()=>{ if(!P.in&&!P.out) return K.noMoney; const s=[K.profit(money(P.profit),P.in?P.margin:null)];
      if(S.profitGoal){ const [y,m,d]=today().split("-").map(Number), dim=new Date(y,m,0).getDate(), left=dim-d+1;
        s.push(P.profit>=S.profitGoal?K.goalHit:K.goal(money(S.profitGoal-P.profit),money(Math.ceil((S.profitGoal-P.profit)/left)))); }
      return s.join(" "); };
    switch(id){
      case "home": case "overview":
        out.push(hi, K.time(clock,date), K.day(D,S.mission.goal?goalPct():0), K.tasks(done), K.streak(streak()), profitLine());
        if(id==="home"){ const lb=Parent.label(); out.push(K.note(lb.name), Parent.note()); } else out.push(K.assets(money(balance()+cryptoValue()+fundsValue())));
        break;
      case "mission": out.push(K.day(D,S.mission.goal?goalPct():0), K.streak(streak()), K.tasks(done), leftTasks()); break;
      case "pipeline": { const c=k=>S.kanban.filter(x=>x.col===k).length, cols=Object.keys(L.cols);
        if(!S.kanban.length) out.push(K.emptyPipe); else { out.push(K.pipe(...cols.map(c))); const nx=S.kanban.find(x=>x.col===cols[0]); if(nx) out.push(K.nextIdea(nx.title)); } break; }
      case "wallet": { out.push(K.wallet(money(balance()),money(sumWallet(30,"in")))); const w=S.wallet.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
        if(w) out.push(K.last(w.type==="in", money(w.amount), w.cat||"")); break; }
      case "profit": { out.push(profitLine()); const [y,m,d]=today().split("-").map(Number), dim=new Date(y,m,0).getDate(); if(P.in||P.out) out.push(K.forecast(money(Math.round(P.profit/d*dim)))); break; }
      case "portfolio": out.push(K.assets(money(balance()+cryptoValue()+fundsValue())), K.port((S.crypto||[]).length,(S.funds||[]).length)); break;
      case "products": out.push(K.prods((S.products||[]).length)); break;
      case "agents": out.push(K.agents(hasLic())); break;
      case "chat": out.push(K.chat); break;
      case "settings": out.push(K.settings); break;
    }
    return out.filter(Boolean).join(" ");
  }
  function role(id){ return id==="home"?Parent.cfg().role:"guide"; }
  // Én tilstand for alle tal-knapper: tryk = tal, tryk igen = stop
  document.addEventListener("click",e=>{ const b=e.target.closest("[data-talk]"); if(!b) return; buzz(10);
    if(b.classList.contains("on")){ Voice.stop(); return; }
    Voice.speak(sentences(current), role(current), b); },true);
  function refresh(){ const show=Voice.available()&&Voice.on(); document.querySelectorAll("[data-talk]").forEach(b=>b.hidden=!show); }
  return { sentences, refresh };
})();

    const L=da?{

    }:{

      proud:[`All four tasks today! I'm so proud of you${C}. Take the evening off with a clear conscience.`],
      income:[`You made money today! Enjoy it – and remember to put a little aside for taxes. 😉`],
      goal:[`You reached your goal for the month. You worked hard for that${C}. Celebrate with someone you care about.`],
      weekend:[`It's the weekend${C}. Remember to rest too – creativity needs breaks.`,`Weekend: go for a walk, call a friend. The channel is fine while you rest.`],
      morning:[`Good morning${C}. Eat some breakfast before you start. It's day ${D} – one good video is enough.`,`Good morning${C} 💛 I believe in you. Take the first small step and the rest will follow.`,`Good morning. You don't have to be perfect today, just be on your way.`],

    let text=null, err=null;
    try{ const r=await fetch(COACH_API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({license:store.get(K.lic,""),lang,persona:cfg(),messages:store.get(HIST,[]).slice(-20),context:coachContext()})});
      const j=await r.json().catch(()=>({})); if(r.ok&&j.text) text=j.text; else err=j.error||"default"; }catch{ err="network"; }
    busy=false; const h2=store.get(HIST,[]);
    if(text){ h2.push({role:"assistant",content:text}); store.set(HIST,h2.slice(-30)); Voice.autoSay(md(text),cfg().role,"answer"); } else { h2.pop(); store.set(HIST,h2); $("paIn").value=q; toast(t().errors[err]||t().errors.default); }
    if(current==="chat") render(); }
  $("paForm").onsubmit=e=>{ e.preventDefault(); ask($("paIn").value); };
  $("paIn").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(max-width:860px)").matches){ e.preventDefault(); $("paForm").requestSubmit(); } });

  $("paSave").onclick=()=>{ store.set(KEY,{role:$("paRole").value,name:$("paName").value.trim().slice(0,24)}); $("paSet").classList.remove("on"); toast(t().paSaved); render(); if(current==="home") renderHome(); };

// Reaktioner i fællesskabet
$("chRoomList").addEventListener("click",async e=>{ const b=e.target.closest("[data-rx]"); if(!b||b.disabled) return; buzz(10);
  const key=b.dataset.key, emoji=b.dataset.rx, m=chRoom.find(x=>x.key===key); if(!m) return;

  const rx=m.rx=Object.assign({heart:0,clap:0,fire:0,mine:[]},m.rx); const had=rx.mine.includes(emoji);
  rx[emoji]+=had?-1:1; rx.mine=had?rx.mine.filter(x=>x!==emoji):rx.mine.concat(emoji); renderRoom();

    const j=await r.json().catch(()=>({})); if(r.ok&&j.rx){ m.rx=j.rx; renderRoom(); } else { rx[emoji]+=had?1:-1; rx.mine=had?rx.mine.concat(emoji):rx.mine.filter(x=>x!==emoji); renderRoom(); toast(j.error==="rate_limited"?t().chSlow:t().errors.default); }

function winSuggestions(){ const W=t().wins, out=[], P=profitNow(), posted=S.kanban.filter(c=>c.col==="posted").length;

function renderWinPick(prefill){ const L=t();

// Varme milepæle
const Moments=(()=>{ const KEY="redhue_moments"; let queue=[], showing=false, timer=null;
  function checks(){ const P=profitNow(), mk=today().slice(0,7), s=streak(), d=missionDay();
    return { firstIncome:S.wallet.some(w=>w.type==="in"), firstPosted:S.kanban.some(c=>c.col==="posted"),
      streak3:s>=3, streak7:s>=7, streak14:s>=14, streak30:s>=30,
      ["goal-"+mk]:!!S.mission.goal&&sumMonth(mk,"in")>=S.mission.goal, ["profitGoal-"+mk]:!!S.profitGoal&&P.profit>=S.profitGoal,
      day30:d>=30, day60:d>=60, day90:d>=90 }; }
  function sumMonth(mk,type){ return S.wallet.filter(w=>w.type===type&&String(w.date).slice(0,7)===mk).reduce((a,w)=>a+ +w.amount,0); }
  function brokeStreak(){ // i går under 2 opgaver, og dagene før havde en streak på mindst 3
    const y=addDays(today(),-1); if(dayDone(y)) return false; let n=0, d=addDays(y,-1); while(dayDone(d)&&n<40){ n++; d=addDays(d,-1); } return n>=3; }
  function scan(){ const seen=store.get(KEY,null), c=checks();
    if(seen===null){ const init={}; Object.keys(c).forEach(k=>{ if(c[k]) init[k]=1; }); init["kind-"+today()]=1; store.set(KEY,init); return; } // eksisterende brugere: ingen lavine af gamle milepæle
    const order=["day90","streak30","goal","profitGoal","day60","streak14","firstIncome","firstPosted","streak7","day30","streak3"];
    const fresh=Object.keys(c).filter(k=>c[k]&&!seen[k]).sort((a,b)=>order.indexOf(a.split("-")[0])-order.indexOf(b.split("-")[0]));
    if(brokeStreak()&&!seen["kind-"+today()]&&!(S.mission.checks[today()]||[]).some(Boolean)) fresh.push("kind-"+today());
    if(!fresh.length) return;
    fresh.forEach(k=>seen[k]=1); store.set(KEY,seen);
    queue.push(fresh[0]); // højst én fejring ad gangen; resten markeres stille
    if(!showing) next(); }
  function next(){ const id=queue.shift(); if(!id){ showing=false; return; } showing=true;
    const base=id.split("-")[0], M=t().mom, [em,title,txt]=M[base];
    $("momEm").textContent=em; $("momT").textContent=title; $("momP").textContent=txt; try{ Voice.autoSay(title+". "+txt,(Parent.cfg?Parent.cfg().role:"mom"),"all"); }catch(e){}
    const acts=[];
    if(base==="kind") acts.push(`<button class="primary" data-mom="one">${esc(M.one)}</button>`);
    else if(hasLic()) acts.push(`<button data-mom="share" data-txt="${esc(em+" "+title)}">${esc(M.share)}</button>`);
    acts.push(`<button class="${base==="kind"?"":"primary"}" data-mom="ok">${esc(M.ok)}</button>`);
    $("momActs").innerHTML=acts.join(""); $("moment").hidden=false; buzz(base==="kind"?8:[12,60,18]); setTimeout(()=>$("momActs").querySelector(".primary")?.focus(),50); }
  function close(){ $("moment").hidden=true; setTimeout(next,300); }
  $("moment").addEventListener("click",e=>{ const b=e.target.closest("[data-mom]"); if(e.target===$("moment")) return close(); if(!b) return;
    const a=b.dataset.mom; close(); if(a==="share") openShareWin(b.dataset.txt); else if(a==="one") go("mission"); });
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("moment").hidden) close(); });
  return { scan:()=>{ clearTimeout(timer); timer=setTimeout(scan,700); } };
})();
window.__moments=Moments; Moments.scan();

    wallet_in:()=>close(()=>{ go("wallet"); setTimeout(()=>{ $("wType").value="in"; fillCats(); $("wAmt").focus(); },120); }),

  }

  function topics(){ return [["next",T("Hvad skal jeg nu?","What should I do next?")],["wallet_in",T("+ Indtægt","+ Income")],["go:profit","Profit"],["go:mission","Mission"],["install",T("Installér app","Install app")],["pro",hasLic()?"Pro ✓":"Pro"]]; }

  // Næste bedste skridt ud fra brugerens egne tal
  function nextStep(){
    const done=(S.mission.checks[today()]||[]).filter(Boolean).length, P=profitNow();
    if(!S.mission.niche) return [T("Første skridt: vælg din niche, så kan resten af appen ramme dig bedre.","First step: pick your niche so the rest of the app fits you better."),[["restart",T("Vælg niche","Pick a niche")]]];
    if(done<2) return [T(`Du har klaret ${done} af dagens 4 opgaver. Klarer du ${2-done} mere, holder din streak på ${streak()} 🔥.`,`You've done ${done} of today's 4 tasks. Do ${2-done} more to keep your ${streak()} 🔥 streak.`),[["checks",T("Til dagens opgaver","To today's tasks")]]];
    if(!S.kanban.some(c=>c.col!=="posted")) return [T("Din pipeline er tom. Læg 3 idéer ind, så ved du altid, hvad næste video er.","Your pipeline is empty. Add 3 ideas so you always know your next video."),[["idea",T("+ Ny idé","+ New idea")]]];
    if(!S.wallet.some(w=>String(w.date).slice(0,7)===today().slice(0,7))) return [T("Du har ikke logget nogen tal denne måned. Log selv små beløb, så kan du se din udvikling.","You haven't logged anything this month. Log even small amounts to see your progress."),[["wallet_in",T("+ Indtægt","+ Income")],["wallet_out",T("+ Udgift","+ Expense")]]];
    if(!S.profitGoal) return [T(`Du står på ${money(P.profit)} i profit denne måned. Sæt et profitmål, så viser appen, hvad du mangler pr. dag.`,`You're at ${money(P.profit)} profit this month. Set a profit goal and the app shows what you need per day.`),[["profitgoal",T("Sæt profitmål","Set profit goal")]]];
    if(!isStandalone()) return [T("Installér REDHUE på telefonen, så får du hjemmeskærmen i fuld skærm og kan dele links direkte til din pipeline.","Install REDHUE on your phone to get the full-screen home screen and share links straight into your pipeline."),[["install",T("Installér nu","Install now")]]];
    if(!hasLic()) return [T("Du er godt i gang! 🎉 Vil du skrive hurtigere, kan Pro give dig AI-agenter, en coach der kender dine tal, og fællesskabet.","You're well on your way! 🎉 Want to write faster? Pro gives you AI agents, a coach that knows your numbers, and the community."),[["pro",T("Om Pro","About Pro")]]];
    return [T(`Alt ser godt ud: ${done}/4 opgaver i dag, ${streak()} 🔥 i streak og ${money(P.profit)} i profit. Spørg coachen, hvad der giver mest lige nu.`,`Everything looks good: ${done}/4 tasks today, a ${streak()} 🔥 streak and ${money(P.profit)} profit. Ask the coach what will move the needle now.`),[["coach",T("Spørg coachen","Ask the coach")]]];
  }

  // Velkomst for nye brugere
  const NICHES=()=>da()?["Fakta & viden","Historie","Motivation","Penge & økonomi","Tech & AI","Natur & dyr"]:["Facts & knowledge","History","Motivation","Money & finance","Tech & AI","Nature & animals"];
  const GOALS=[1000,3000,5000,10000];
  function onboard(){
    const s=st(); s.step="name"; save(s);
    say(T("Hej, jeg er <b>REDHUE Guide</b> ✦ Jeg hjælper dig i gang på 30 sekunder. Hvad skal jeg kalde dig?","Hi, I'm <b>REDHUE Guide</b> ✦ I'll get you set up in 30 seconds. What should I call you?"),
      S.profile.name?[["name:"+S.profile.name,S.profile.name]]:[],true);
    setTimeout(()=>$("gdIn").focus(),250);
  }
  function onboardAnswer(txt){
    const s=st();
    if(s.step==="name"){ const n=txt.trim().slice(0,40); if(!n) return;
      S.profile=Object.assign({},S.profile,{name:n}); save_(); s.step="niche"; save(s);
      say(T(`Rart at møde dig, ${esc(n)}! Hvilken niche laver du videoer om?`,`Nice to meet you, ${esc(n)}! What niche are your videos about?`), NICHES().map(x=>["niche:"+x,x]).concat([["niche:?",T("Ved ikke endnu","Not sure yet")]]),true); return; }
    if(s.step==="niche"){ const n=txt==="?"?"":txt.trim().slice(0,60); S.mission.niche=n; save_(); s.step="goal"; save(s);
      say((n?T(`${esc(n)} er et godt valg. `,`${esc(n)} is a good pick. `):T("Helt fint, du kan vælge senere under Mission. ","No problem, you can pick later under Mission. "))+T("Hvor meget vil du gerne tjene om måneden?","How much would you like to earn per month?"),
        GOALS.map(g=>["goal:"+g,money(g)]),true); return; }
    if(s.step==="goal"){ const g=Math.max(0,parseInt(String(txt).replace(/\D/g,""))||0); if(g) S.mission.goal=g; save_(); s.step=null; s.onboarded=true; save(s); addXP(10);
      say(T(`Klar! 🎯 Din 90-dages mission er sat op${g?` med et mål på <b>${money(g)}</b> om måneden`:""}. Her er dit første skridt:`,`Done! 🎯 Your 90-day mission is set${g?` with a goal of <b>${money(g)}</b> a month`:""}. Here's your first step:`));
      setTimeout(()=>{ say(...nextStep()); if(!isStandalone()&&os()!=="desktop") say(T("Tip: installér REDHUE på telefonen, så føles den som din egen app.","Tip: install REDHUE on your phone so it feels like your own app."),[["install",T("Installér nu","Install now")]]); },400);
      renderSection(current); }
  }
  function save_(){ store.set(K.state,S); }

  // Svar på fritekst
  function answer(q){
    const n=q.toLowerCase().normalize("NFC");
    // Sikkerhedsnet: ved tegn på krise stopper app-snakken
    if(/(selvmord|tage mit (eget )?liv|vil ikke leve|ikke leve mere|skade mig selv|gøre skade på mig selv|slå mig selv ihjel|suicid|kill myself|end my life|don'?t want to live|self[- ]?harm|hurt myself)/.test(n))
      return say(T(`Det gør mig ondt, at du har det sådan. Du behøver ikke stå alene med det. Ring til <b>Livslinien på 70 201 201</b>, eller chat med dem via livslinien.dk. Ved akut psykisk krise kan du også ringe til lægevagten døgnet rundt${(()=>{ const v=Safe.lvNumber(); return v?` – i ${esc(v.region)} på <b>${esc(v.num)}</b>`:" (fx <b>1813</b> i Region Hovedstaden)"; })()}. Er du i akut fare, så ring <b>112</b> nu. Fortæl gerne også en, du stoler på, hvordan du har det.`,"I'm really sorry you're feeling this way. You don't have to carry it alone. Please reach out to a crisis line now – <b>findahelpline.com</b> lists one for your country – or call your local emergency number if you're in immediate danger. It can also help to tell someone you trust how you're feeling."));
    const s=st(); if(s.step) return onboardAnswer(q);
    if(/^(hej|hi|hello|hallo|yo|godmorgen|goddag)\b/.test(n)) return say(T(`Hej ${esc(S.profile.name||"")}! 👋 Hvad kan jeg hjælpe med?`,`Hi ${esc(S.profile.name||"")}! 👋 What can I help with?`),topics());
    if(/^(tak|mange tak|tusind tak|tak skal du have|thanks|thank you|ty)\b/.test(n)&&n.length<30) return say(T("Selv tak! Jeg er her, når du har brug for mig. ✦","You're welcome! I'm here whenever you need me. ✦"));
    if(/(hvad skal jeg|næste|what should i|next step|hvor starter|where do i start|kom i gang|get started)/.test(n)) return say(...nextStep());
    let best=null, score=0;
    for(const e of KB){ const sc=e.k.reduce((a,k)=>a+(n.includes(k)?k.length:0),0); if(sc>score){ score=sc; best=e; } }
    if(best) return say(best.a(), best.b());
    const acts=[["help",T("Vis hvad du kan","Show what you can do")]];
    if(hasLic()) acts.unshift(["coach:"+q,T("Spørg AI-coachen","Ask the AI coach")]);
    say(T("Det er jeg ikke sikker på. Prøv at spørge om fx profit, mission, pipeline, Pro eller installation.","I'm not sure about that. Try asking about profit, mission, pipeline, Pro or installing.")+(hasLic()?T(" Eller lad AI-coachen svare:"," Or let the AI coach answer:"):""),acts);
  }

  // Visning
  function say(html,btns=[],keep){ const s=st(); s.log.push({b:1,h:html,a:btns}); s.log=s.log.slice(-40); save(s); render(); if(!$("gd").hidden) Voice.autoSay(html,"guide","answer"); }
  function me(txt){ const s=st(); s.log.push({b:0,h:esc(txt)}); s.log=s.log.slice(-40); save(s); render(); }
  function render(){
    const s=st(), el=$("gdList");
    el.innerHTML=s.log.map((m,i)=>`<div class="gd-m ${m.b?"":"me"}">${m.b?Voice.btn("guide"):""}<p>${m.h}</p></div>`+(m.b&&m.a&&m.a.length&&i===s.log.length-1?`<div class="gd-acts">${m.a.map(([id,l])=>`<button type="button" class="small" data-gd="${esc(id)}">${esc(l)}</button>`).join("")}</div>`:"")).join("");
    el.scrollTop=el.scrollHeight;
  }
  function open(){ $("gd").hidden=false; $("gdFab").classList.remove("gd-new"); $("gdFab").querySelector(".gd-dot")?.remove();
    const s=st(); if(!s.log.length){ s.onboarded||S.mission.niche&&S.profile.name ? (s.onboarded=true,save(s),say(T(`Hej ${esc(S.profile.name||"")}! 👋 Jeg er REDHUE Guide. Hvad kan jeg hjælpe med?`,`Hi ${esc(S.profile.name||"")}! 👋 I'm REDHUE Guide. What can I help with?`),topics())) : onboard(); }
    else render();
    if(!matchMedia("(pointer:coarse)").matches) setTimeout(()=>$("gdIn").focus(),200);
    if(!(history.state&&history.state.guide)) history.pushState({guide:1},"",location.hash);
  }
  // Luk guiden; næste skærm åbnes først, når historikken er rullet tilbage (ellers trækker "tilbage" appen væk igen)
  let afterClose=null;
  function close(cb){ if($("gd").hidden){ cb&&cb(); return; } $("gd").hidden=true;
    if(history.state&&history.state.guide){ afterClose=cb||null; history.back(); setTimeout(()=>{ if(afterClose){ const f=afterClose; afterClose=null; f(); } },400); } else cb&&cb(); }
  addEventListener("popstate",()=>{ if(!$("gd").hidden) $("gd").hidden=true; if(afterClose){ const f=afterClose; afterClose=null; setTimeout(f,0); } });
  $("gdFab").onclick=()=>$("gd").hidden?open():close();
  $("gdX").onclick=()=>close();
  $("gdForm").onsubmit=e=>{ e.preventDefault(); const q=$("gdIn").value.trim(); if(!q) return; $("gdIn").value=""; me(q); setTimeout(()=>answer(q),250); };
  $("gdList").addEventListener("click",e=>{ const b=e.target.closest("[data-gd]"); if(!b) return; const id=b.dataset.gd; buzz();
    if(/^(name|niche|goal):/.test(id)){ const v=id.split(":").slice(1).join(":"); me(b.textContent); setTimeout(()=>onboardAnswer(v),200); return; }

/* ---------- 4D-motor ---------- */
const D4 = (()=>{
  const KEY="redhue_4d", reduce=matchMedia("(prefers-reduced-motion:reduce)");
  const cv=$("fx4d"), cx=cv.getContext("2d");
  let W=0,H=0,DPR=1, raf=0, last=0, t0=performance.now();
  let tx=0,ty=0, gx=0,gy=0, haveTilt=false;
  const on=()=>store.get(KEY, !reduce.matches);
  // Tesserakt: 16 hjørner (±1)^4, kanter mellem hjørner der adskiller sig i én koordinat
  const V=[]; for(let i=0;i<16;i++) V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
  const E=[]; for(let i=0;i<16;i++) for(let b=0;b<4;b++){ const j=i^(1<<b); if(j>i) E.push([i,j]); }
  // Lys-partikler i dybden
  const P=Array.from({length:70},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
  function size(){ DPR=Math.min(1.5,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
  function rot(a,i,j,th){ const c=Math.cos(th),s=Math.sin(th),x=a[i],y=a[j]; a[i]=x*c-y*s; a[j]=x*s+y*c; }
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(now-last<33) return; last=now;                       // ca. 30 billeder/sek. for batteriet
    const t=(now-t0)/1000;
    tx+=(gx-tx)*.08; ty+=(gy-ty)*.08;                       // blød bevægelse
    const root=document.documentElement.style;
    root.setProperty("--tx",tx.toFixed(3)); root.setProperty("--ty",ty.toFixed(3));
    root.setProperty("--oy",(scrollY+H/2).toFixed(0)+"px");
    cx.clearRect(0,0,W,H);
    // partikler: nærmeste bevæger sig mest ved vip
    for(const p of P){ p.z-=.0016; if(p.z<=.02){ p.z=1; p.x=Math.random()*2-1; p.y=Math.random()*2-1; }
      const k=1/p.z, sx=W/2+(p.x*W*.5+tx*40)*k*.35, sy=H/2+(p.y*H*.5+ty*30)*k*.35;
      if(sx<0||sx>W||sy<0||sy>H) continue;
      const a=Math.min(.55,(1-p.z)*.7), r=(1-p.z)*1.8+.3;
      cx.fillStyle=`rgba(${p.x>0?"155,107,255":"62,232,255"},${a})`; cx.beginPath(); cx.arc(sx,sy,r,0,6.283); cx.fill(); }
    // tesserakt: rotation i XW, YW og ZW-planerne = bevægelse gennem den 4. dimension
    const phone=W<700, home=current==="home";
    // Telefon: bag uret på hjemmeskærmen, ellers lavt og dæmpet bag kortene. Computer: til højre.
    const S0=Math.min(W,H)*(phone?(home?.24:.3):.22), cxp=W*(phone?.5:.72)+tx*-26, cyp=H*(phone?(home?.15:.62):.46)+ty*-20, fade=phone&&!home?.45:1;
    const pts=V.map(v=>{ const a=v.slice(); rot(a,0,3,t*.31); rot(a,1,3,t*.19+ty*.4); rot(a,2,3,t*.23); rot(a,0,1,t*.07+tx*.5);
      const w=1/(2.6-a[3]); const x=a[0]*w, y=a[1]*w, z=a[2]*w; const q=1/(2.8-z); return [cxp+x*q*S0*2.2, cyp+y*q*S0*2.2, a[3]]; });
    cx.lineWidth=1.1;
    for(const [i,j] of E){ const A=pts[i],B=pts[j], d=(A[2]+B[2])/2; // farve efter dybde i 4. dimension
      const al=(.10+.22*((d+1)/2))*fade;
      cx.strokeStyle= d>.3?`rgba(255,79,216,${al})`: d<-.3?`rgba(62,232,255,${al})`:`rgba(155,107,255,${al})`;
      cx.beginPath(); cx.moveTo(A[0],A[1]); cx.lineTo(B[0],B[1]); cx.stroke(); }
    for(const A of pts){ cx.fillStyle=`rgba(242,241,248,${(.25+.35*((A[2]+1)/2))*fade})`; cx.beginPath(); cx.arc(A[0],A[1],1.6+A[2]*.8,0,6.283); cx.fill(); }
  }
  function start(){ if(raf||document.hidden||!on()) return; size(); last=0; raf=requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  function apply(){ const v=on(); document.documentElement.classList.toggle("d4",v); if(v) start(); else { stop(); cx.clearRect(0,0,W,H); ["--tx","--ty"].forEach(k=>document.documentElement.style.setProperty(k,0)); } renderBtn(); }
  function renderBtn(){ const b=$("d4Btn"); if(!b) return; b.textContent=on()?t().d4On:t().d4Off; b.classList.toggle("primary",on());
    $("d4Motion").hidden=!(on()&&typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"&&!haveTilt); }
  function set(v){ store.set(KEY,!!v); apply(); buzz(12); }
  function enter(id){ if(!on()||reduce.matches) return;
    const el= id==="home"? $("os") : $("s-"+id); if(!el) return;
    el.classList.remove("d4-in"); void el.offsetWidth; el.classList.add("d4-in");
    setTimeout(()=>el.classList.remove("d4-in"),750); }
  // Input: telefonens vip (gyroskop) eller musen på computer
  addEventListener("deviceorientation",e=>{ if(e.gamma==null) return; haveTilt=true;
    gx=Math.max(-1,Math.min(1,e.gamma/28)); gy=Math.max(-1,Math.min(1,((e.beta||50)-50)/28)); },{passive:true});
  addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse"||haveTilt||matchMedia("(pointer:coarse)").matches) return; gx=(e.clientX/innerWidth-.5)*2; gy=(e.clientY/innerHeight-.5)*2; },{passive:true});
  async function askMotion(){ try{ const r=await DeviceOrientationEvent.requestPermission(); if(r==="granted") haveTilt=true; }catch{} renderBtn(); }
  // Kort-vip og glans på computer
  if(matchMedia("(pointer:fine)").matches){
    document.addEventListener("pointermove",e=>{ if(!on()) return; const c=e.target.closest&&e.target.closest("#main .card"); 
      document.querySelectorAll("#main .card.d4-tilt").forEach(x=>{ if(x!==c) x.classList.remove("d4-tilt"); });
      if(!c||c.offsetHeight>520) return;
      if(!c.querySelector(":scope>.d4-sheen")){ const s=document.createElement("i"); s.className="d4-sheen"; c.appendChild(s); }
      const r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      c.style.setProperty("--cry",((px-.5)*7).toFixed(2)+"deg"); c.style.setProperty("--crx",((.5-py)*6).toFixed(2)+"deg");
      c.style.setProperty("--mx",(px*100).toFixed(1)+"%"); c.style.setProperty("--my",(py*100).toFixed(1)+"%"); c.classList.add("d4-tilt"); },{passive:true});
    document.addEventListener("pointerleave",()=>document.querySelectorAll(".card.d4-tilt").forEach(x=>x.classList.remove("d4-tilt")));
  }
  addEventListener("resize",()=>{ if(raf) size(); });
  document.addEventListener("visibilitychange",()=>{ document.hidden?stop():start(); });
  reduce.addEventListener?.("change",apply);
  return { on, set, apply, enter, askMotion, renderBtn };
})();
$("d4Btn").onclick=()=>D4.set(!D4.on());
$("d4Motion").onclick=()=>D4.askMotion();

async function roomFetch(){
  if(document.hidden) return;
  // Hver 6. gang (ca. 30 sek.) hentes hele rummet, så andres sletninger også forsvinder her
  const full = (chPolls++ % 6)===0;
  const since=(!full&&chRoom.length)?chRoom[chRoom.length-1].key:"";
  try{
    const r=await fetch(CHAT_API+(since?"?since="+encodeURIComponent(since):""),{headers:{"x-license":store.get(K.lic,"")}});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ if(r.status===402){ roomStop(); toast(t().errors.pro_required); } return; }
    if(full){ const fresh=j.messages||[]; const sig=a=>JSON.stringify(a.map(m=>[m.key,m.rx]));
      if(sig(fresh)!==sig(chRoom.slice(-fresh.length))||fresh.length!==Math.min(chRoom.length,60)){ chRoom=fresh; if(current==="chat"&&chTab==="room") renderRoom(); }
      noteCheers(); return; }
    const seen=new Set(chRoom.map(m=>m.key)); let added=false;
    (j.messages||[]).forEach(m=>{ if(!seen.has(m.key)){ chRoom.push(m); added=true; } });
    if(added){ chRoom=chRoom.slice(-200); if(current==="chat"&&chTab==="room") renderRoom(); }
  }catch{}
}

function monthSum(key){ const r=S.wallet.filter(w=>String(w.date).slice(0,7)===key);
  const i=r.filter(x=>x.type==="in").reduce((a,x)=>a+ +x.amount,0), o=r.filter(x=>x.type==="out").reduce((a,x)=>a+ +x.amount,0);
  return {in:i,out:o,profit:i-o,margin:i?Math.round((i-o)/i*100):0}; }
function profitNow(){ return monthSum(today().slice(0,7)); }
function catShare(type,days){ const from=addDays(today(),-days), m={};
  S.wallet.filter(w=>w.type===type && String(w.date).slice(0,10)>=from).forEach(w=>{ m[w.cat||"–"]=(m[w.cat||"–"]||0)+ +w.amount; });

function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|\W)\*(.+?)\*(?=\W|$)/g,"$1<em>$2</em>"); }
function md(src){
  const L=src.split("\n"); let h="", list=null, i=0; const close=()=>{ if(list){ h+=`</${list}>`; list=null; } };
  const row=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  while(i<L.length){ const l=L[i]; let m;
    if(/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||"")){ close();
      h+="<table><tr>"+row(l).map(c=>`<th>${inl(c)}</th>`).join("")+"</tr>"; i+=2;
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])){ h+="<tr>"+row(L[i]).map(c=>`<td>${inl(c)}</td>`).join("")+"</tr>"; i++; }
      h+="</table>"; continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); h+=`<h5>${inl(m[1])}</h5>`; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); h+="<ul>"; list="ul"; } h+=`<li>${inl(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); h+="<ol>"; list="ol"; } h+=`<li>${inl(m[1])}</li>`; }
    else if(!l.trim()) close();
    else { close(); h+=`<p>${inl(l)}</p>`; }
    i++; }
  close(); return h;
}

async function callAgent(agent, fields){
  agState[agent]="run"; renderAgentCardsOnly();
  $("agOut").innerHTML=`<div class="loader"><i></i><i></i><i></i></div>`;
  if(!Net.online()){
    Net.enqueue({type:"agent",body:{agent,lang,fields}}); agState[agent]=""; renderAgentCardsOnly();
    $("agOut").innerHTML=`<div class="err" style="border-color:var(--am,#ffc247);color:var(--am,#ffc247)">${esc(lang==="en"?"You're offline. The request is queued and runs by itself when you're back online – the result appears under History.":"Du er offline. Kørslen er sat i kø og kører af sig selv, når du er online igen – svaret kommer under Historik.")}</div>`;
    return null;
  }
  try{
    const r=await Net.tfetch(CFG.API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({agent,lang,fields,license:store.get(K.lic,"")})},60000);
    const d=await r.json().catch(()=>({error: r.status===404?"network":"default"}));
    if(!r.ok) throw new Error(d.error||"default");
    agState[agent]="done"; agLast={agent,text:d.text}; showAgOut(d.text,agent);
    const h=store.get(K.hist,[]); h.unshift({agent,text:d.text,at:Date.now(),label:(fields.topic||fields.niche||"").slice(0,40)}); store.set(K.hist,h.slice(0,30));
    logAct("agent", t().ag[agent][0]); addXP(20); renderAgHist(); renderAgentCardsOnly();
    return d.text;
  }catch(e){
    agState[agent]=""; renderAgentCardsOnly();
    const key = (e.message==="Failed to fetch"||e.message==="timeout") ? "network" : e.message;
    $("agOut").innerHTML=`<div class="err">${t().errors[key]||t().errors.default}</div>`; agButtons(null);
    return null;
  }
}
