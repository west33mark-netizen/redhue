/* ---------- Auto-gem ----------
   Alt gemmes allerede løbende. Auto-gem tager desuden kopier af alle dine data
   (efter ændringer, når appen lukkes, og én pr. dag), så du kan gå tilbage, hvis noget går galt.
   Kopierne ligger kun på telefonen (IndexedDB). Ufærdige tekster i felter huskes også. */
const AutoSave=(()=>{
  const L=(da,en)=>lang==="en"?en:da;
  const SKIP=new Set(["redhue_outbox","redhue_ver","redhue_drafts","redhue_autosave"]);
  const KEEP_RECENT=20, KEEP_DAYS=14, KEEP_MANUAL=10;
  const DRAFT_IDS=["fbText","chCoachIn","paIn","chRoomIn","gratIn","kTitle","wNote"];
  let timer=null, lastHash="", lastAt=0, dbp=null, mem=[];
  // --- lager: IndexedDB, ellers localStorage (fx i forhåndsvisning)
  function db(){ if(dbp) return dbp; dbp=new Promise(res=>{ try{ const r=indexedDB.open("redhue-autosave",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("snaps",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); return dbp; }
  async function all(){ const d=await db(); if(!d) return store.get("redhue_autosave",mem);
    return new Promise(res=>{ try{ const q=d.transaction("snaps").objectStore("snaps").getAll(); q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.at-a.at)); q.onerror=()=>res([]); }catch(e){ res([]); } }); }
  async function put(sn){ const d=await db(); if(!d){ const l=[sn,...store.get("redhue_autosave",mem)].slice(0,5); mem=l; store.set("redhue_autosave",l); return; }
    return new Promise(res=>{ try{ const t=d.transaction("snaps","readwrite"); t.objectStore("snaps").put(sn); t.oncomplete=res; t.onerror=res; }catch(e){ res(); } }); }
  async function del(ids){ const d=await db(); if(!d||!ids.length) return;
    return new Promise(res=>{ try{ const t=d.transaction("snaps","readwrite"); ids.forEach(i=>t.objectStore("snaps").delete(i)); t.oncomplete=res; t.onerror=res; }catch(e){ res(); } }); }
  // --- kopier
  function collect(){ const data={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("redhue_")&&!SKIP.has(k)) data[k]=localStorage.getItem(k); } }catch(e){} return data; }
  const hash=str=>{ let h=5381; for(let i=0;i<str.length;i++) h=(h*33+str.charCodeAt(i))|0; return String(h>>>0); };
  function summary(data){ try{ const st=JSON.parse(data[K.state]||"{}"); const inc=(st.wallet||[]).filter(w=>w.type==="in").reduce((a,w)=>a+(+w.amount||0),0);
      return {name:(st.profile&&st.profile.name)||"", wallet:(st.wallet||[]).length, pipeline:(st.kanban||[]).length, income:inc}; }catch(e){ return {}; } }
  async function snap(reason,force){
    const data=collect(); const str=JSON.stringify(data); const h=hash(str);
    if(!force&&h===lastHash) return null;
    if(!Object.keys(data).length) return null;
    const sn={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),at:Date.now(),reason,hash:h,size:str.length,sum:summary(data),version:VERSION,data};
    await put(sn); lastHash=h; lastAt=sn.at; await prune(); paint(); return sn;
  }
  async function prune(){ const l=await all(); const keep=new Set(), days=new Set(); let manual=0;
    l.forEach((sn,i)=>{ const day=new Date(sn.at).toISOString().slice(0,10), age=(Date.now()-sn.at)/864e5;
      if(i<KEEP_RECENT) keep.add(sn.id);
      if(age<=KEEP_DAYS&&!days.has(day)){ days.add(day); keep.add(sn.id); }
      if((sn.reason==="manual"||sn.reason==="before-restore")&&manual<KEEP_MANUAL){ manual++; keep.add(sn.id); } });
    await del(l.filter(sn=>!keep.has(sn.id)).map(sn=>sn.id)); }
  function touch(){ clearTimeout(timer); const st=$("asStatus"); if(st){ st.classList.add("busy"); st.textContent=L("Gemmer kopi…","Saving copy…"); } timer=setTimeout(()=>snap("auto"),20000); }
  async function restore(id){
    const l=await all(); const sn=l.find(x=>x.id===id); if(!sn) return toast(L("Kopien findes ikke længere","That copy no longer exists"));
    await snap("before-restore",true);
    try{ const rm=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("redhue_")&&!SKIP.has(k)&&!(k in sn.data)) rm.push(k); }
      rm.forEach(k=>localStorage.removeItem(k)); Object.entries(sn.data).forEach(([k,v])=>localStorage.setItem(k,v)); }catch(e){ return toast(L("Kunne ikke gendanne: ","Couldn't restore: ")+e.message); }

/* ---------- Offline først ----------
   Alt i appen gemmes på telefonen og virker uden net. Det, der kræver server
   (AI, feedback), lægges i en kø og sendes automatisk, når nettet er tilbage. */
const Net=(()=>{
  const L=(da,en)=>lang==="en"?en:da, KQ="redhue_outbox";
  let busy=false;
  const online=()=>navigator.onLine!==false;
  const queue=()=>store.get(KQ,[]);
  // fetch med tidsgrænse, så en dårlig forbindelse ikke hænger appen
  async function tfetch(url,opts={},ms=15000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
    try{ return await fetch(url,{...opts,signal:c.signal}); } catch(e){ throw new Error(e.name==="AbortError"?"timeout":"network"); } finally{ clearTimeout(t); } }
  function enqueue(item){ const q=queue(); q.push({...item,at:Date.now(),id:uid()}); store.set(KQ,q.slice(-50)); paint(); }
  function paint(){ const n=queue().length;
    document.querySelectorAll("[data-net]").forEach(el=>{ el.hidden=online()&&!n; el.textContent=online()?(n?n+L(" venter"," waiting"):""):"Offline"+(n?" · "+n:""); el.classList.toggle("off",!online()); el.title=online()?L("Sendes nu","Sending now"):L("Alt gemmes på telefonen","Everything is saved on your phone"); }); document.querySelectorAll(".os-status .live").forEach(d=>d.classList.toggle("off",!online())); const ol=$("osLbl"); if(ol) ol.textContent=online()?"REDHUE OS 2":"OFFLINE"+(n?" · "+n:"");
    const b=$("btQueue"); if(b) b.textContent=n?L(n+" i kø – sendes når du er online",n+" queued – sent when you're online"):L("Intet i kø","Nothing queued"); }
  async function flush(){
    if(busy||!online()) return; const q=queue(); if(!q.length) return; busy=true; let sent=0;
    for(const it of q){
      try{
        if(it.type==="feedback"){ const r=await tfetch(apiUrl("/api/feedback"),{method:"POST",headers:it.headers,body:JSON.stringify(it.body)}); if(!r.ok&&r.status>=500) throw 0; }
        else if(it.type==="agent"){ const r=await tfetch(CFG.API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...it.body,license:store.get(K.lic,"")})},60000);
          const d=await r.json().catch(()=>({})); if(!r.ok){ if(r.status>=500||r.status===429) throw 0; } else {
            const h=store.get(K.hist,[]); h.unshift({agent:it.body.agent,text:d.text,at:Date.now(),label:(it.body.fields.topic||it.body.fields.niche||"").slice(0,40)+" ⏳"}); store.set(K.hist,h.slice(0,30)); try{ renderAgHist(); }catch(e){} } }
        store.set(KQ,queue().filter(x=>x.id!==it.id)); sent++;
      }catch(e){ break; }
    }
    busy=false; paint();
    if(sent) toast(L(`Online igen – ${sent} ventende sendt ✓`,`Back online – ${sent} queued item(s) sent ✓`));
  }
  function init(){
    addEventListener("online",()=>{ paint(); flush(); });
    addEventListener("offline",()=>{ paint(); toast(L("Du er offline – alt du laver gemmes på telefonen","You're offline – everything you do is saved on your phone")); });
    paint(); setTimeout(flush,1500);

    try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(p=>p||navigator.storage.persist()); }catch(e){}
  }
  return {online,tfetch,enqueue,flush,paint,init,queue};
})();
/* ---------- Opdatering og genstart ----------
   Ny udgave hentes i baggrunden. Når den er klar, vises "Ny version klar · Genstart".
   Data ligger i telefonens lager og røres ikke af en genstart. */
const Updater=(()=>{
  const L=(da,en)=>lang==="en"?en:da;
  let reg=null, reloading=false, waiting=null, wanted=false;
  const canSW=()=>{ try{ return "serviceWorker" in navigator && window.isSecureContext && ON_SITE && window.top===window.self; }catch(e){ return false; } };
  function show(w){ waiting=w; $("updTxt").textContent=L("Ny version klar","New version ready"); $("updGo").textContent=L("Genstart","Restart"); $("updBar").hidden=false; }
  function watch(r){
    if(r.waiting && navigator.serviceWorker.controller) show(r.waiting);
    r.addEventListener("updatefound",()=>{ const nw=r.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller) show(nw); }); });
  }
  function restart(){
    $("updBar").hidden=true;
    if(waiting){ wanted=true; waiting.postMessage("skip"); setTimeout(()=>location.reload(),2500); } // controllerchange genindlæser normalt før
    else location.reload();
  }
  async function check(manual){
    if(!canSW()){ if(manual){ if(IS_PREVIEW) toast(L("Forhåndsvisning: åbn redhue.netlify.app for opdateringer","Preview: open redhue.netlify.app for updates")); else location.reload(); } return; }
    try{ if(!reg) reg=await navigator.serviceWorker.getRegistration(); if(!reg) return;
      await reg.update();
      if(manual) setTimeout(()=>{ if($("updBar").hidden) toast(L("Du har den nyeste version ("+VERSION+")","You're on the latest version ("+VERSION+")")); },1500);
    }catch(e){ if(manual) toast(L("Kunne ikke søge efter opdatering – er du online?","Couldn't check for updates – are you online?")); }
  }
  async function hardRestart(){
    try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
    try{ if(canSW()){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); } }catch(e){}
    location.reload();
  }
  function init(){
    $("updGo").onclick=restart;
    // Fortæl brugeren, når en ny version er taget i brug
    const last=store.get("redhue_ver",""); if(last && last!==VERSION) setTimeout(()=>toast(L("Opdateret til ","Updated to ")+VERSION+" ✨"),900); store.set("redhue_ver",VERSION);
    if(IS_PREVIEW){ $("pvTxt").textContent=L("Forhåndsvisning – feedback, AI og deling virker i den rigtige app:","Preview – feedback, AI and sharing work in the real app:"); $("pvBar").hidden=false; }
    if(!canSW()) return;
    // Genindlæs kun når brugeren selv har trykket Genstart (ikke ved første installation)
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!wanted||reloading) return; reloading=true; location.reload(); });
    navigator.serviceWorker.register("sw.js").then(r=>{ reg=r; watch(r); }).catch(()=>{});
    setInterval(()=>check(false),30*60*1000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(false); });
  }
  return {init,check,hardRestart};
})();

/* ---------- Filtjek ved import ---------- */
const SIGS=[ // [bytes, navn, billede?]
  [[0x89,0x50,0x4E,0x47],"PNG",1],[[0xFF,0xD8,0xFF],"JPEG",1],[[0x47,0x49,0x46,0x38],"GIF",1],[[0x52,0x49,0x46,0x46],"WebP/RIFF",1],
  [[0x25,0x50,0x44,0x46],"PDF",0],[[0x50,0x4B,0x03,0x04],"ZIP",0],[[0x4D,0x5A],"Windows .exe",0],[[0x1F,0x8B],"GZIP",0],[[0x7B,0x5C,0x72,0x74,0x66],"RTF",0]];
const fmtSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
function sniff(u8,off=0){ for(const [sig,name,img] of SIGS) if(sig.every((b,i)=>u8[off+i]===b)) return {name,img}; return null; }
function checkBackupBytes(buf){
  const u8=new Uint8Array(buf), F=t().fc;
  if(!u8.length) return {lvl:"bad",msg:F.empty,type:"—"};
  if(u8.length>20*1048576) return {lvl:"bad",msg:F.big,type:"?"};
  const sig=sniff(u8);
  if(sig) return {lvl:"bad",msg:sig.img?F.image(sig.name):F.binary(sig.name),type:sig.name};
  // Binær fil der er blevet "tekst-konverteret": starter med U+FFFD + signatur (fx "(U+FFFD)PNG")
  const REPL=[0xEF,0xBF,0xBD];
  const starts=REPL.every((b,i)=>u8[i]===b);
  let n=0; for(let i=0;i<u8.length-2;i++) if(u8[i]===0xEF&&u8[i+1]===0xBF&&u8[i+2]===0xBD){n++;i+=2;}
  const txt=new TextDecoder("utf-8").decode(u8);
  if(starts||n>20){ const orig=starts?(sniff(u8,3)||{name:({PNG:"PNG",PDF:"PDF"})[txt.slice(1,4)]||""}).name:""; 
    const guess=orig||(/^\uFFFDPNG/.test(txt)?"PNG":"");
    return {lvl:"bad",msg:F.mangled(guess?guess+"-billede":"",n),type:"Tekst (ødelagt binær)"}; }
  let d; try{ d=JSON.parse(txt.replace(/^﻿/,"")); }catch(err){
    const m=/position (\d+)/.exec(err.message||""); let pos=F.atEnd;
    if(m){ const k=+m[1], before=txt.slice(0,k).split("\n"); pos=F.atLine(before.length,before.at(-1).length+1); }
    return {lvl:"bad",msg:F.notJson(pos),type:"Tekst"}; }

  // Reparér felter med forkert type
  const st=d.state; let fixed=0;
  for(const k of ["wallet","crypto","funds","products","kanban","log"]) if(k in st && !Array.isArray(st[k])){ st[k]=[]; fixed++; }
  for(const k of ["prices","agentDrafts","mission","profile"]) if(k in st && (typeof st[k]!=="object"||Array.isArray(st[k])||st[k]===null)){ delete st[k]; fixed++; }
  if("xp" in st && !Number.isFinite(+st.xp)){ st.xp=0; fixed++; } else if("xp" in st) st.xp=+st.xp;
  if(Array.isArray(st.wallet)){ const before=st.wallet.length; st.wallet=st.wallet.filter(r=>r&&Number.isFinite(+r.amt||+r.amount||0)); fixed+=before-st.wallet.length; }
  if(d.agentHistory && !Array.isArray(d.agentHistory)){ d.agentHistory=null; fixed++; }
  const c={wallet:(st.wallet||[]).length,kanban:(st.kanban||[]).length,products:(st.products||[]).length,crypto:(st.crypto||[]).length,funds:(st.funds||[]).length,xp:st.xp||0};
  return {lvl:fixed?"warn":"ok",msg:fixed?F.fixed(fixed):F.ok,type:"REDHUE backup v"+v,data:d,counts:c};
}

  async function tunerToggle(){
    if(tun){ tun.stop(); tun=null; rSong(); return; }
    try{ const ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}}); ac=ac||new (window.AudioContext||window.webkitAudioContext)(); await ac.resume();
      const src=ac.createMediaStreamSource(ms), an=ac.createAnalyser(); an.fftSize=2048; src.connect(an); const buf=new Float32Array(an.fftSize); let raf=0;
      const loop=()=>{ an.getFloatTimeDomainData(buf); const f=pitch(buf,ac.sampleRate); const nEl=$("tnNote");
        if(nEl&&f){ const n=12*Math.log2(f/440)+69, r=Math.round(n), cents=Math.round((n-r)*100); nEl.textContent=NN[((r%12)+12)%12]+(Math.floor(r/12)-1); $("tnNeedle").style.left=(50+cents)+"%"; $("tnCents").textContent=(cents>0?"+":"")+cents+" cent · "+f.toFixed(0)+" Hz"; $("tnNeedle").classList.toggle("ok",Math.abs(cents)<=10); }
        raf=requestAnimationFrame(loop); };
      tun={stop:()=>{ cancelAnimationFrame(raf); ms.getTracks().forEach(t=>t.stop()); }}; rSong(); loop();

  // Autokorrelation: finder grundtonen i et lydstykke
  function pitch(b,sr){ let rms=0; for(const x of b) rms+=x*x; rms=Math.sqrt(rms/b.length); if(rms<.01) return 0;
    let best=-1,bestC=0; const min=Math.floor(sr/1000), max=Math.floor(sr/70);
    for(let lag=min;lag<max;lag++){ let c=0; for(let i=0;i<b.length-lag;i++) c+=b[i]*b[i+lag]; if(c>bestC){ bestC=c; best=lag; } }
    return best>0?sr/best:0; }

  // ----- Stamtræ
  function rTree(){
    const s=st(), P=s.tree.people;
    if(!P.length){ P.push({id:uid(),name:(S.profile&&S.profile.name)||L("Mig","Me"),me:true,parents:[],partner:""}); put(s); }
    // generationer: mig = 0, forældre = -1, børn = +1
    const gen={}, me=P.find(p=>p.me)||P[0]; gen[me.id]=0; const q=[me.id];
    while(q.length){ const id=q.shift(), p=P.find(x=>x.id===id); if(!p) continue;
      (p.parents||[]).forEach(pid=>{ if(gen[pid]===undefined){ gen[pid]=gen[id]-1; q.push(pid); } });
      P.filter(c=>(c.parents||[]).includes(id)).forEach(c=>{ if(gen[c.id]===undefined){ gen[c.id]=gen[id]+1; q.push(c.id); } });
      if(p.partner&&gen[p.partner]===undefined){ gen[p.partner]=gen[id]; q.push(p.partner); } }
    P.forEach(p=>{ if(gen[p.id]===undefined) gen[p.id]=0; });
    const rows=[...new Set(Object.values(gen))].sort((a,b)=>a-b);

      <div class="card life-card"><div class="lbl">${esc(L("Tilføj person","Add person"))}</div><form id="tpForm" class="life-form"><input id="tpName" placeholder="${esc(L("Navn","Name"))}" required maxlength="80"><div class="life-2"><input id="tpBorn" placeholder="${esc(L("Født (år)","Born (year)"))}" inputmode="numeric" maxlength="10"><input id="tpDied" placeholder="${esc(L("Død (år)","Died (year)"))}" inputmode="numeric" maxlength="10"></div>
        <div class="life-2"><select id="tpRel"><option value="parent">${esc(L("er forælder til","is parent of"))}</option><option value="child">${esc(L("er barn af","is child of"))}</option><option value="partner">${esc(L("er partner til","is partner of"))}</option><option value="sibling">${esc(L("er søskende til","is sibling of"))}</option></select><select id="tpTo">${P.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
        <button class="primary">${esc(L("Tilføj","Add"))}</button></form><p class="sub" style="margin:8px 0 0">${esc(L("Stamtræet ligger kun på din telefon og kommer med i auto-gem og backup.","The tree is only on your phone and is included in auto-save and backups."))}</p></div>

    $("tpForm").onsubmit=e=>{ e.preventDefault(); const s=st(), P=s.tree.people, to=P.find(p=>p.id===$("tpTo").value), rel=$("tpRel").value;
      const np={id:uid(),name:$("tpName").value.trim(),born:$("tpBorn").value.trim(),died:$("tpDied").value.trim(),parents:[],partner:""};
      if(rel==="parent"){ to.parents=[...(to.parents||[]),np.id].slice(-2); }

      if(rel==="partner"){ np.partner=to.id; to.partner=np.id; }
      if(rel==="sibling"){ np.parents=[...(to.parents||[])]; if(!np.parents.length){ const pp={id:uid(),name:L("Ukendt forælder","Unknown parent"),parents:[],partner:""}; P.push(pp); to.parents=[pp.id]; np.parents=[pp.id]; } }

let tY=null,tX=null,tEl=null;
document.addEventListener("touchstart",e=>{ if(current!=="home") return; const p=e.touches[0]; tY=p.clientY; tX=p.clientX; tEl=e.target; },{passive:true});
document.addEventListener("touchend",e=>{ if(tY===null) return; const p=e.changedTouches[0], dy=p.clientY-tY, dx=p.clientX-tX; const startY=tY; tY=null;
  if(Math.abs(dy)<60 || Math.abs(dx)>Math.abs(dy)) return;
  const inPanel=tEl&&tEl.closest("#osPanel"), inDrawer=tEl&&tEl.closest("#osDrawer");
  if(inPanel && dy<0) return closeSheets();
  if(inDrawer && dy>0 && $("osDrawer").scrollTop<=0) return closeSheets();
  if(sheetOpen()) return;
  const os=$("os");
  if(dy>0 && os.scrollTop<=0 && startY<innerHeight*.4) openSheet("osPanel");
  else if(dy<0 && os.scrollTop+os.clientHeight>=os.scrollHeight-4) openSheet("osDrawer");
},{passive:true});

function renderAvatars(){ ["heroAv","avPrev"].forEach(id=>{ const el=$(id); if(el) el.innerHTML=avatarHTML(); }); if($("avDel")) $("avDel").hidden=!S.profile.avatar; }
// Beskær til kvadrat og skalér til 320 px, så billedet fylder lidt (ca. 20-40 KB)
function loadAvatar(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
  const s=Math.min(im.width,im.height), c=document.createElement("canvas"); c.width=c.height=320;
  c.getContext("2d").drawImage(im,(im.width-s)/2,Math.max(0,(im.height-s)/4),s,s,0,0,320,320);
  res(c.toDataURL("image/jpeg",.86)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }
$("avPick").onclick=()=>$("avFile").click();
$("avFile").onchange=async()=>{ const f=$("avFile").files[0]; $("avFile").value=""; if(!f) return;
  try{ S.profile=Object.assign({},S.profile,{avatar:await loadAvatar(f)}); save(); renderAvatars(); toast(t().avSaved); }catch{ toast(t().avBad); } };
$("avDel").onclick=()=>{ S.profile=Object.assign({},S.profile,{avatar:""}); save(); renderAvatars(); };

function applyStatic(){
  document.documentElement.lang=lang;
  $("langBtn").textContent = $("langBtnM").textContent = lang==="da"?"EN":"DA";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=t()[el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t()[el.dataset.tp]);
  const buyOk=/^https:\/\/[^/]+\/l\//.test(CFG.GUMROAD_URL) && !/YOUR_NAME/.test(CFG.GUMROAD_URL);
  document.querySelectorAll(".buyLink").forEach(a=>{ a.href=CFG.GUMROAD_URL; a.hidden=!buyOk; });
}
function renderSection(id){
  ({overview:renderOverview,mission:renderMission,pipeline:renderPipeline,wallet:renderWallet,portfolio:renderPortfolio,products:renderProducts,agents:renderAgents,settings:renderSettings,home:renderHome,profit:renderProfit,chat:renderChat,safe:()=>Safe.render(),life:()=>Life.render()}[id]||(()=>{}))();
}
function renderAll(){ applyStatic(); go(current); }
const toggleLang=()=>{ lang = lang==="da"?"en":"da"; store.set(K.lang,lang); renderAll(); };
$("langBtn").onclick=toggleLang; $("langBtnM").onclick=toggleLang;
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h && h!==current) go(h); });

// Gumroad redirect: ?license=KEY
const qLic=new URLSearchParams(location.search).get("license")||(()=>{ const b=(new URLSearchParams(location.search).get("beta")||"").trim().toUpperCase(); return /^BETA-[0-9A-F]{5}-[0-9A-F]{5}$/.test(b)?b:""; })();
if(qLic){ store.set(K.lic,qLic); history.replaceState(null,"",location.pathname+"#agents"); current="agents"; }

// Opstart i sikre trin: fejler ét trin (fx 4D eller stemmer), starter resten af appen alligevel
__safeRun("render",()=>renderAll());
__safeRun("4D",()=>D4.apply());
__safeRun("tale",()=>Talk.refresh());
__safeRun("priser",()=>{ if(S.crypto.length && (!S.pricesAt || Date.now()-S.pricesAt>10*60e3)) refreshPrices(); });
__safeRun("kanal",()=>document.querySelectorAll("[data-channel]").forEach(el=>{ el.textContent=CHANNEL.toUpperCase(); el.dataset.ch=CHANNEL; })); __safeRun("opdatering",()=>Updater.init()); __safeRun("offline",()=>Net.init()); __safeRun("auto-gem",()=>AutoSave.init()); __safeRun("hilsen",()=>Voice.daily()); __safeRun("liv",()=>Life.init());
