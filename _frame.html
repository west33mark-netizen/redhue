/* =========================================================
   CRYSTAL INTERFACE  (farve- og glaslag oven på basis-designet)
   ========================================================= */
:root{
  --bg:#06060e; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
  --text:#f2f1f8; --muted:#9a98b0;
  --cy:#3ee8ff; --bl:#4d8dff; --vi:#9b6bff; --ma:#ff4fd8; --red:#ff2d46; --red2:#ff7a3d; --am:#ffc247; --ok:#3ddc97; --warn:#ffc247;
  --s-in:#3ee8ff; --s-out:#ff4fd8;
  --crystal:linear-gradient(120deg,var(--cy),var(--vi) 45%,var(--ma) 75%,var(--red));
  --glass:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 60%);
  --acc:var(--vi);
}
html,body{background:var(--bg)}
body{background:transparent;background-image:none}
body::before{content:&quot;&quot;;position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px) saturate(150%);opacity:1;
  background:
    radial-gradient(38% 32% at 12% 8%,rgba(62,232,255,.30),transparent 70%),
    radial-gradient(34% 30% at 88% 12%,rgba(255,79,216,.26),transparent 70%),
    radial-gradient(40% 36% at 70% 88%,rgba(155,107,255,.30),transparent 70%),
    radial-gradient(30% 28% at 18% 85%,rgba(255,45,70,.20),transparent 70%);
  animation:aurora 28s ease-in-out infinite alternate}
body::after{content:&quot;&quot;;position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
@keyframes aurora{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(8deg)}100%{transform:translate(-3%,3%) rotate(-6deg)}}

/* Glas-flader */
.card,.col,.agent-card{background:var(--glass),rgba(14,14,28,.45);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.02),0 12px 36px -12px rgba(0,0,0,.6);
  position:relative;overflow:hidden;overflow:clip;border-radius:18px}
.card::before,.col::before,.agent-card::before{content:&quot;&quot;;position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.9;pointer-events:none}
.card::after,.agent-card::after{content:&quot;&quot;;position:absolute;width:180px;height:180px;right:-60px;top:-80px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%);pointer-events:none}
.card&gt;*,.agent-card&gt;*{position:relative;z-index:1}
.card:hover{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}

/* Farve pr. kort (nøgletal m.m.) */
.grid&gt;.card:nth-child(6n+1){--acc:var(--cy)}
.grid&gt;.card:nth-child(6n+2){--acc:var(--vi)}
.grid&gt;.card:nth-child(6n+3){--acc:var(--ma)}
.grid&gt;.card:nth-child(6n+4){--acc:var(--am)}
.grid&gt;.card:nth-child(6n+5){--acc:var(--ok)}
.grid&gt;.card:nth-child(6n+6){--acc:var(--bl)}
.hero{--acc:var(--ma)}
.av-ini{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font:700 34px &#x27;Space Grotesk&#x27;,sans-serif;color:#08081a;background:var(--crystal);box-shadow:0 0 24px -4px var(--ma);flex:none;user-select:none}
@media(max-width:620px){.av-ini{width:64px;height:64px;font-size:26px}}
.av-set{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.av-set .av-ini,.av-set img{width:64px;height:64px;font-size:26px;border-radius:50%;object-fit:cover;object-position:top}
.av-set img{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--crystal) border-box}
.kpi .v{color:var(--acc);text-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent)}
.kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--ma)}
.card h3{color:color-mix(in srgb,var(--acc) 55%,var(--muted))}

/* Sidebar + brand */
aside{background:linear-gradient(180deg,rgba(20,18,40,.55),rgba(8,8,18,.55));border-right:1px solid var(--line);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.brand .dot{background:conic-gradient(var(--cy),var(--vi),var(--ma),var(--red),var(--am),var(--cy));box-shadow:0 0 16px var(--vi),0 0 30px rgba(62,232,255,.4);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1 span{background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}

.nav-btn[data-go=&quot;wallet&quot;]{--acc:var(--ok)}
.nav-btn[data-go=&quot;portfolio&quot;]{--acc:var(--am)}
.nav-btn[data-go=&quot;products&quot;]{--acc:var(--red)}
.nav-btn[data-go=&quot;settings&quot;]{--acc:#b9b7cc}
.nav-btn{border-radius:12px;transition:.18s}
.nav-btn .ic{color:var(--acc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 60%,transparent))}
.nav-btn:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.nav-btn.active{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 24%,transparent),color-mix(in srgb,var(--acc) 4%,transparent));
  border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:inset 3px 0 0 var(--acc),0 0 22px -6px var(--acc)}
.nav-btn .pro{border-color:var(--bl);color:var(--bl)}
.topbar{background:rgba(8,8,18,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

  .bottomnav{background:rgba(10,10,22,.7);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-top:1px solid var(--line)}
  .bottomnav .nav-btn.active{box-shadow:inset 0 -2px 0 var(--acc),0 0 18px -6px var(--acc)}
}

/* Overskrifter */
h2.sec{background:linear-gradient(90deg,#fff 30%,color-mix(in srgb,var(--vi) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Knapper + felter */

/* ---------- Chart: In vs Out, last 6 months ---------- */
function monthly(){
  const out=[]; const [ty,tm]=today().split(&quot;-&quot;).map(Number);
  for(let i=5;i&gt;=0;i--){
    const m=new Date(ty, tm-1-i, 1); const key=ymd(m).slice(0,7);
    const rows=S.wallet.filter(w=&gt;w.date.slice(0,7)===key);
    out.push({ label:m.toLocaleDateString(lang===&quot;da&quot;?&quot;da-DK&quot;:&quot;en-GB&quot;,{month:&quot;short&quot;}), key,
      in:rows.filter(r=&gt;r.type===&quot;in&quot;).reduce((a,r)=&gt;a+ +r.amount,0),
      out:rows.filter(r=&gt;r.type===&quot;out&quot;).reduce((a,r)=&gt;a+ +r.amount,0) });
  }
  return out;
}
function niceMax(v){ if(v&lt;=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n&lt;=1?1:n&lt;=2?2:n&lt;=5?5:10)*p; }
function drawChart(el){
  const data=monthly(), W=560, H=220, L=48, R=8, Tp=10, B=26;
  const max=niceMax(Math.max(...data.flatMap(d=&gt;[d.in,d.out])));
  const cw=(W-L-R)/data.length, bw=Math.min(18,(cw-14)/2);
  const y=v=&gt;Tp+(H-Tp-B)*(1-v/max);
  let g=&quot;&quot;;
  for(let i=0;i&lt;=4;i++){ const v=max*i/4, yy=y(v);
    g+=`&lt;line x1=&quot;${L}&quot; x2=&quot;${W-R}&quot; y1=&quot;${yy}&quot; y2=&quot;${yy}&quot; stroke=&quot;rgba(255,255,255,.07)&quot; stroke-width=&quot;1&quot;/&gt;`+
       `&lt;text x=&quot;${L-8}&quot; y=&quot;${yy+4}&quot; fill=&quot;#9a98b0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; font-family=&quot;JetBrains Mono&quot;&gt;${abbr(v)}&lt;/text&gt;`; }
  const bar=(x,v,c)=&gt;{ if(v&lt;=0) return &quot;&quot;; const top=y(v), h=(H-B)-top, r=Math.min(4,h);
    return `&lt;path d=&quot;M${x},${H-B} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${H-B} Z&quot; fill=&quot;${c}&quot;/&gt;`; };
  data.forEach((d,i)=&gt;{
    const cx=L+cw*i+cw/2;
    g+=bar(cx-bw-1,d.in,&quot;var(--s-in)&quot;)+bar(cx+1,d.out,&quot;var(--s-out)&quot;);
    g+=`&lt;text x=&quot;${cx}&quot; y=&quot;${H-8}&quot; fill=&quot;#9a98b0&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;${esc(d.label)}&lt;/text&gt;`;
    g+=`&lt;rect class=&quot;hit&quot; data-i=&quot;${i}&quot; x=&quot;${L+cw*i}&quot; y=&quot;${Tp}&quot; width=&quot;${cw}&quot; height=&quot;${H-Tp-B}&quot; fill=&quot;transparent&quot;/&gt;`;
  });
  el.innerHTML = `&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--s-in)&quot;&gt;&lt;/i&gt;${t().legendIn}&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--s-out)&quot;&gt;&lt;/i&gt;${t().legendOut}&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;${esc(t().last6)}&quot;&gt;${g}&lt;/svg&gt;&lt;div class=&quot;tip&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  const tip=el.querySelector(&quot;.tip&quot;), wrap=el.querySelector(&quot;.chart&quot;);
  el.querySelectorAll(&quot;.hit&quot;).forEach(h=&gt;{
    const show=()=&gt;{ const d=data[+h.dataset.i]; h.setAttribute(&quot;fill&quot;,&quot;rgba(255,255,255,.04)&quot;);
      tip.innerHTML=`&lt;b&gt;${esc(d.label)}&lt;/b&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;${t().legendIn}&lt;/span&gt; ${money(d.in)}&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;${t().legendOut}&lt;/span&gt; ${money(d.out)}&lt;br&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;Netto&lt;/span&gt; ${money(d.in-d.out)}`;
      const r=h.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
      tip.style.left=Math.min(wr.width-150, Math.max(0, r.left-wr.left+r.width/2-70))+&quot;px&quot;; tip.style.top=&quot;0px&quot;; tip.style.opacity=1; };
    const hide=()=&gt;{ h.setAttribute(&quot;fill&quot;,&quot;transparent&quot;); tip.style.opacity=0; };
    h.addEventListener(&quot;mouseenter&quot;,show); h.addEventListener(&quot;mouseleave&quot;,hide);
    h.addEventListener(&quot;touchstart&quot;,show,{passive:true});
  });
}
function abbr(v){ return v&gt;=1e6? (v/1e6).toFixed(1).replace(&quot;.0&quot;,&quot;&quot;)+&quot;M&quot; : v&gt;=1e3? (v/1e3).toFixed(v%1000?1:0).replace(&quot;.0&quot;,&quot;&quot;)+&quot;k&quot; : Math.round(v); }

const Voice=(()=&gt;{
  const KEY=&quot;redhue_voice&quot;, ss=window.speechSynthesis;
  const ok=!!(ss&amp;&amp;window.SpeechSynthesisUtterance);
  const cfg=()=&gt;Object.assign({on:true,rate:.9,voices:{}},store.get(KEY,{}));
  const TONE={mom:{pitch:1.08},dad:{pitch:.86},mentor:{pitch:.98},coach:{pitch:1},guide:{pitch:1.04}};
  const FEM=/female|kvinde|woman|frau|sara|helle|naja|ida|christel|pernille|freja|tilde|zira|samantha|karen|susan|serena|tessa|fiona|victoria|moira|allison|ava|kate|jenny|aria|emma/i;
  const MAL=/male|mand|man\b|magnus|jeppe|mads|carsten|daniel|alex|fred|tom|george|guy|ryan|david|mark|thomas|lee|oliver/i;
  let current=null, curBtn=null;
  const all=()=&gt;ok?ss.getVoices():[];
  const forLang=()=&gt;{ const l=lang===&quot;en&quot;?&quot;en&quot;:&quot;da&quot;; const v=all().filter(x=&gt;(x.lang||&quot;&quot;).toLowerCase().startsWith(l)); return v.length?v:all(); };
  function auto(role){ const v=forLang(); if(!v.length) return null;
    const want=role===&quot;mom&quot;?FEM:role===&quot;dad&quot;?MAL:null;
    const score=x=&gt;(want&amp;&amp;want.test(x.name)?4:0)+(want&amp;&amp;!want.test(x.name)&amp;&amp;(role===&quot;mom&quot;?MAL:FEM).test(x.name)?-3:0)+(/natural|neural|premium|enhanced|google/i.test(x.name)?2:0)+(x.localService?1:0);
    return v.slice().sort((a,b)=&gt;score(b)-score(a))[0]; }
  function voiceFor(role){ const uri=cfg().voices[role]; return (uri&amp;&amp;all().find(v=&gt;v.voiceURI===uri))||auto(role); }
  function clean(s){
    // Blokke (punkter, afsnit, linjeskift) bliver til pauser, så lister ikke læses i ét hug
    const html=String(s||&quot;&quot;).replace(/&lt;\/(li|p|h[1-6]|div|ol|ul)&gt;|&lt;br\s*\/?&gt;/gi,&quot;. &quot;);
    const d=document.createElement(&quot;div&quot;); d.innerHTML=html; let t=d.textContent||&quot;&quot;;
    t=t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,&quot;&quot;).replace(/[*_#`&gt;|]/g,&quot;&quot;)
      .replace(/(^|[.!?]\s+)[-•]\s+/g,&quot;$1&quot;).replace(/(^|[.!?]\s+)\d+[.)]\s+/g,&quot;$1&quot;).replace(/\n+/g,&quot;. &quot;)
      .replace(/\s*[–—]\s*/g,&quot;, &quot;).replace(/([.!?])\s*[,.]+/g,&quot;$1&quot;).replace(/\s+([,.!?])/g,&quot;$1&quot;).replace(/^[,.\s]+/,&quot;&quot;).replace(/\s+/g,&quot; &quot;).trim();
    return t; }
  function stop(){ if(ok) ss.cancel(); if(curBtn){ curBtn.classList.remove(&quot;on&quot;); curBtn.title=t().voPlay; } current=null; curBtn=null; }
  function speak(text,role=&quot;mentor&quot;,btn){
    if(!ok) return;
    if(btn&amp;&amp;curBtn===btn){ stop(); return; }
    stop(); const s=clean(text); if(!s) return;
    const u=new SpeechSynthesisUtterance(s), v=voiceFor(role), c=cfg();
    u.lang=(v&amp;&amp;v.lang)||(lang===&quot;en&quot;?&quot;en-GB&quot;:&quot;da-DK&quot;); if(v){ try{ u.voice=v; }catch{} }
    u.rate=Math.min(1.1,Math.max(.7,+c.rate||.9)); u.pitch=(TONE[role]||TONE.mentor).pitch; u.volume=.95;

  const btn=(role)=&gt;ok&amp;&amp;cfg().on?`&lt;button type=&quot;button&quot; class=&quot;say&quot; data-say=&quot;${role}&quot; title=&quot;${esc(t().voPlay)}&quot; aria-label=&quot;${esc(t().voPlay)}&quot;&gt;🔊&lt;/button&gt;`:&quot;&quot;;

  function renderSettings(){
    const L=t(), c=cfg(), v=forLang();
    $(&quot;voSub&quot;).textContent=ok&amp;&amp;all().length?L.voSubOk(v.length):L.voSubNone;
    $(&quot;voBtn&quot;).textContent=c.on?L.voOn:L.voOff; $(&quot;voBtn&quot;).classList.toggle(&quot;primary&quot;,c.on); $(&quot;voBtn&quot;).disabled=!ok;
    $(&quot;voAutoBtn&quot;).textContent=c.auto?L.voAutoOn:L.voAutoOff; $(&quot;voAutoBtn&quot;).classList.toggle(&quot;primary&quot;,!!c.auto); $(&quot;voAutoBtn&quot;).disabled=!ok||!c.on;
    $(&quot;voRate&quot;).value=c.rate; $(&quot;voRateV&quot;).textContent=(+c.rate).toFixed(2)+&quot;×&quot;;
    $(&quot;voRows&quot;).innerHTML=!ok||!all().length?&quot;&quot;:[&quot;mom&quot;,&quot;dad&quot;,&quot;mentor&quot;,&quot;coach&quot;,&quot;guide&quot;].map(r=&gt;`&lt;div class=&quot;vo-row&quot;&gt;&lt;span&gt;${esc(L.voWho[r])}&lt;/span&gt;&lt;select data-vo=&quot;${r}&quot;&gt;&lt;option value=&quot;&quot;&gt;${esc(L.voAuto)}${auto(r)?&quot; · &quot;+esc(auto(r).name):&quot;&quot;}&lt;/option&gt;${v.map(x=&gt;`&lt;option value=&quot;${esc(x.voiceURI)}&quot; ${c.voices[r]===x.voiceURI?&quot;selected&quot;:&quot;&quot;}&gt;${esc(x.name)}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;&lt;button class=&quot;small&quot; data-votest=&quot;${r}&quot;&gt;${esc(L.voTest)}&lt;/button&gt;&lt;/div&gt;`).join(&quot;&quot;); }
  $(&quot;voBtn&quot;).onclick=()=&gt;{ const c=cfg(); c.on=!c.on; store.set(KEY,c); stop(); renderSettings(); if(window.Talk) Talk.refresh(); };
  $(&quot;voAutoBtn&quot;).onclick=()=&gt;{ const c=cfg(); c.auto=!c.auto; store.set(KEY,c); renderSettings(); };
  $(&quot;voRate&quot;).oninput=()=&gt;{ const c=cfg(); c.rate=+$(&quot;voRate&quot;).value; store.set(KEY,c); $(&quot;voRateV&quot;).textContent=c.rate.toFixed(2)+&quot;×&quot;; };
  $(&quot;voRows&quot;).addEventListener(&quot;change&quot;,e=&gt;{ const s=e.target.closest(&quot;[data-vo]&quot;); if(!s) return; const c=cfg(); if(s.value) c.voices[s.dataset.vo]=s.value; else delete c.voices[s.dataset.vo]; store.set(KEY,c); });
  $(&quot;voRows&quot;).addEventListener(&quot;click&quot;,e=&gt;{ const b=e.target.closest(&quot;[data-votest]&quot;); if(b) speak(t().voSample,b.dataset.votest,b); });
  if(ok&amp;&amp;ss.addEventListener) ss.addEventListener(&quot;voiceschanged&quot;,()=&gt;{ if(current===&quot;settings&quot;) renderSettings(); });
  addEventListener(&quot;pagehide&quot;,stop); document.addEventListener(&quot;visibilitychange&quot;,()=&gt;{ if(document.hidden) stop(); });
  return { speak, stop, btn, renderSettings, clean, available:()=&gt;ok, on:()=&gt;cfg().on, auto:()=&gt;ok&amp;&amp;cfg().on&amp;&amp;!!cfg().auto };
})();

const Safe=(()=&gt;{
  const API=&quot;/api/safe&quot;, K_DEV=&quot;redhue_device&quot;, K_EC=&quot;redhue_ec&quot;, K_SH=&quot;redhue_shares&quot;, K_W=&quot;redhue_watch&quot;, K_FD=&quot;redhue_findable&quot;;
  const L=()=&gt;t(), loc=()=&gt;lang===&quot;da&quot;?&quot;da-DK&quot;:&quot;en-GB&quot;;
  function devKey(){ let k=store.get(K_DEV,&quot;&quot;); if(!/^[a-f0-9]{40}$/.test(k)){ k=[...crypto.getRandomValues(new Uint8Array(20))].map(b=&gt;b.toString(16).padStart(2,&quot;0&quot;)).join(&quot;&quot;); store.set(K_DEV,k); } return k; }

    const r=await fetch(API,{method:&quot;POST&quot;,headers,body:JSON.stringify(body)}); const j=await r.json().catch(()=&gt;({})); return {ok:r.ok,status:r.status,j}; }

  const mapUrl=p=&gt;`https://maps.google.com/?q=${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
  const liveUrl=c=&gt;`${location.origin}${location.pathname}#safe?view=${c}`;
  const clockNow=()=&gt;new Date().toLocaleTimeString(loc(),{hour:&quot;2-digit&quot;,minute:&quot;2-digit&quot;,hourCycle:&quot;h23&quot;,timeZone:TZ()}).replace(&quot;.&quot;,&quot;:&quot;);
  function ago(ts){ const s=(Date.now()-ts)/1000, X=L(); return s&lt;60?X.agoNow:s&lt;3600?X.agoMin(Math.round(s/60)):s&lt;86400?X.agoH(Math.round(s/3600)):X.agoD(Math.round(s/86400)); }
  function left(exp){ const m=Math.max(0,Math.round((exp-Date.now())/60000)), X=L(); return m&lt;60?X.minLeft(m):X.hLeft(Math.round(m/60)); }
  const myShares=()=&gt;store.get(K_SH,[]).filter(s=&gt;s.exp&gt;Date.now());
  const isIOS=()=&gt;/iphone|ipad|ipod/i.test(navigator.userAgent);
  const smsHref=(nums,text)=&gt;`sms:${nums.join(&quot;,&quot;)}${isIOS()?&quot;&amp;&quot;:&quot;?&quot;}body=${encodeURIComponent(text)}`;

    watchId=navigator.geolocation.watchPosition(p=&gt;{ lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; push(); },()=&gt;{},{enableHighAccuracy:true,maximumAge:30000,timeout:20000});
    clearInterval(timer); timer=setInterval(push,120000); }
  function stopLive(){ if(watchId!==null&amp;&amp;navigator.geolocation) navigator.geolocation.clearWatch(watchId); watchId=null; clearInterval(timer); timer=null; }
  async function push(force){ if(!lastPos||document.hidden) return; if(!force&amp;&amp;Date.now()-lastSent&lt;30000) return; lastSent=Date.now();

/* ---------- Tal-knap: appen fortæller med dine egne tal, hvad du ser ---------- */
window.Talk=null;
const Talk=(()=&gt;{
  const T=()=&gt;t().talk;
  function sentences(id){
    const L=t(), K=T(), out=[], h=nowHour(), loc=lang===&quot;da&quot;?&quot;da-DK&quot;:&quot;en-GB&quot;, now=new Date();
    const clock=now.toLocaleTimeString(loc,{hour:&quot;2-digit&quot;,minute:&quot;2-digit&quot;,hourCycle:&quot;h23&quot;,timeZone:TZ()}).replace(&quot;.&quot;,&quot;:&quot;);
    const date=now.toLocaleDateString(loc,{weekday:&quot;long&quot;,day:&quot;numeric&quot;,month:&quot;long&quot;,timeZone:TZ()});
    const done=(S.mission.checks[today()]||[]).filter(Boolean).length, P=profitNow(), D=Math.min(missionDay(),90);
    const nm=(S.profile.name||&quot;&quot;).trim(), hi=(h&lt;10?K.hiM:h&lt;18?K.hiD:K.hiE)+(nm?&quot; &quot;+nm:&quot;&quot;)+&quot;.&quot;;
    const leftTasks=()=&gt;{ const c=S.mission.checks[today()]||[]; const l=L.checks.filter((x,i)=&gt;!c[i]); return l.length&amp;&amp;l.length&lt;4?K.left(l.join(&quot;, &quot;)):&quot;&quot;; };
    const profitLine=()=&gt;{ if(!P.in&amp;&amp;!P.out) return K.noMoney; const s=[K.profit(money(P.profit),P.in?P.margin:null)];
      if(S.profitGoal){ const [y,m,d]=today().split(&quot;-&quot;).map(Number), dim=new Date(y,m,0).getDate(), left=dim-d+1;
        s.push(P.profit&gt;=S.profitGoal?K.goalHit:K.goal(money(S.profitGoal-P.profit),money(Math.ceil((S.profitGoal-P.profit)/left)))); }
      return s.join(&quot; &quot;); };
    switch(id){
      case &quot;home&quot;: case &quot;overview&quot;:
        out.push(hi, K.time(clock,date), K.day(D,S.mission.goal?goalPct():0), K.tasks(done), K.streak(streak()), profitLine());
        if(id===&quot;home&quot;){ const lb=Parent.label(); out.push(K.note(lb.name), Parent.note()); } else out.push(K.assets(money(balance()+cryptoValue()+fundsValue())));
        break;
      case &quot;mission&quot;: out.push(K.day(D,S.mission.goal?goalPct():0), K.streak(streak()), K.tasks(done), leftTasks()); break;
      case &quot;pipeline&quot;: { const c=k=&gt;S.kanban.filter(x=&gt;x.col===k).length, cols=Object.keys(L.cols);
        if(!S.kanban.length) out.push(K.emptyPipe); else { out.push(K.pipe(...cols.map(c))); const nx=S.kanban.find(x=&gt;x.col===cols[0]); if(nx) out.push(K.nextIdea(nx.title)); } break; }
      case &quot;wallet&quot;: { out.push(K.wallet(money(balance()),money(sumWallet(30,&quot;in&quot;)))); const w=S.wallet.slice().sort((a,b)=&gt;String(b.date).localeCompare(String(a.date)))[0];
        if(w) out.push(K.last(w.type===&quot;in&quot;, money(w.amount), w.cat||&quot;&quot;)); break; }
      case &quot;profit&quot;: { out.push(profitLine()); const [y,m,d]=today().split(&quot;-&quot;).map(Number), dim=new Date(y,m,0).getDate(); if(P.in||P.out) out.push(K.forecast(money(Math.round(P.profit/d*dim)))); break; }
      case &quot;portfolio&quot;: out.push(K.assets(money(balance()+cryptoValue()+fundsValue())), K.port((S.crypto||[]).length,(S.funds||[]).length)); break;
      case &quot;products&quot;: out.push(K.prods((S.products||[]).length)); break;
      case &quot;agents&quot;: out.push(K.agents(hasLic())); break;
      case &quot;chat&quot;: out.push(K.chat); break;
      case &quot;settings&quot;: out.push(K.settings); break;
    }
    return out.filter(Boolean).join(&quot; &quot;);
  }
  function role(id){ return id===&quot;home&quot;?Parent.cfg().role:&quot;guide&quot;; }
  // Én tilstand for alle tal-knapper: tryk = tal, tryk igen = stop
  document.addEventListener(&quot;click&quot;,e=&gt;{ const b=e.target.closest(&quot;[data-talk]&quot;); if(!b) return; buzz(10);
    if(b.classList.contains(&quot;on&quot;)){ Voice.stop(); return; }
    Voice.speak(sentences(current), role(current), b); },true);
  function refresh(){ const show=Voice.available()&amp;&amp;Voice.on(); document.querySelectorAll(&quot;[data-talk]&quot;).forEach(b=&gt;b.hidden=!show); }
  return { sentences, refresh };
})();

   Varm, men ærlig; siger ærligt at den er en AI; opmuntrer til rigtige mennesker; sikkerhedsnet. */

  const KEY=&quot;redhue_parent&quot;, HIST=&quot;redhue_parent_chat&quot;;

  function note(){

      day:[`Hvordan går det${C}? Husk at drikke vand og rejse dig fra skærmen en gang imellem.`,`Du gør det godt. Små skridt hver dag er dem, der tæller.`,`Har du spist frokost? Det kreative kører bedre på en mæt mave.`],
      evening:[`Godaften${C}. Uanset hvordan dagen gik, er jeg stolt af, at du blev ved.`,`Husk at slukke skærmen i god tid i aften. Søvn er også en del af planen.`,`Ring evt. til en ven i aften. Det er godt at dele det, du er i gang med.`]

      proud:[`All four tasks today! I&#x27;m so proud of you${C}. Take the evening off with a clear conscience.`],

      goal:[`You reached your goal for the month. You worked hard for that${C}. Celebrate with someone you care about.`],

      morning:[`Good morning${C}. Eat some breakfast before you start. It&#x27;s day ${D} – one good video is enough.`,`Good morning${C} 💛 I believe in you. Take the first small step and the rest will follow.`,`Good morning. You don&#x27;t have to be perfect today, just be on your way.`],
      day:[`How&#x27;s it going${C}? Remember to drink water and get up from the screen now and then.`,`You&#x27;re doing well. Small steps every day are the ones that count.`,`Have you had lunch? Creative work runs better on a full stomach.`],

// Varme milepæle
const Moments=(()=&gt;{ const KEY=&quot;redhue_moments&quot;; let queue=[], showing=false, timer=null;
  function checks(){ const P=profitNow(), mk=today().slice(0,7), s=streak(), d=missionDay();
    return { firstIncome:S.wallet.some(w=&gt;w.type===&quot;in&quot;), firstPosted:S.kanban.some(c=&gt;c.col===&quot;posted&quot;),
      streak3:s&gt;=3, streak7:s&gt;=7, streak14:s&gt;=14, streak30:s&gt;=30,
      [&quot;goal-&quot;+mk]:!!S.mission.goal&amp;&amp;sumMonth(mk,&quot;in&quot;)&gt;=S.mission.goal, [&quot;profitGoal-&quot;+mk]:!!S.profitGoal&amp;&amp;P.profit&gt;=S.profitGoal,
      day30:d&gt;=30, day60:d&gt;=60, day90:d&gt;=90 }; }
  function sumMonth(mk,type){ return S.wallet.filter(w=&gt;w.type===type&amp;&amp;String(w.date).slice(0,7)===mk).reduce((a,w)=&gt;a+ +w.amount,0); }
  function brokeStreak(){ // i går under 2 opgaver, og dagene før havde en streak på mindst 3
    const y=addDays(today(),-1); if(dayDone(y)) return false; let n=0, d=addDays(y,-1); while(dayDone(d)&amp;&amp;n&lt;40){ n++; d=addDays(d,-1); } return n&gt;=3; }
  function scan(){ const seen=store.get(KEY,null), c=checks();
    if(seen===null){ const init={}; Object.keys(c).forEach(k=&gt;{ if(c[k]) init[k]=1; }); init[&quot;kind-&quot;+today()]=1; store.set(KEY,init); return; } // eksisterende brugere: ingen lavine af gamle milepæle
    const order=[&quot;day90&quot;,&quot;streak30&quot;,&quot;goal&quot;,&quot;profitGoal&quot;,&quot;day60&quot;,&quot;streak14&quot;,&quot;firstIncome&quot;,&quot;firstPosted&quot;,&quot;streak7&quot;,&quot;day30&quot;,&quot;streak3&quot;];
    const fresh=Object.keys(c).filter(k=&gt;c[k]&amp;&amp;!seen[k]).sort((a,b)=&gt;order.indexOf(a.split(&quot;-&quot;)[0])-order.indexOf(b.split(&quot;-&quot;)[0]));
    if(brokeStreak()&amp;&amp;!seen[&quot;kind-&quot;+today()]&amp;&amp;!(S.mission.checks[today()]||[]).some(Boolean)) fresh.push(&quot;kind-&quot;+today());
    if(!fresh.length) return;
    fresh.forEach(k=&gt;seen[k]=1); store.set(KEY,seen);
    queue.push(fresh[0]); // højst én fejring ad gangen; resten markeres stille
    if(!showing) next(); }
  function next(){ const id=queue.shift(); if(!id){ showing=false; return; } showing=true;
    const base=id.split(&quot;-&quot;)[0], M=t().mom, [em,title,txt]=M[base];
    $(&quot;momEm&quot;).textContent=em; $(&quot;momT&quot;).textContent=title; $(&quot;momP&quot;).textContent=txt;
    const acts=[];
    if(base===&quot;kind&quot;) acts.push(`&lt;button class=&quot;primary&quot; data-mom=&quot;one&quot;&gt;${esc(M.one)}&lt;/button&gt;`);
    else if(hasLic()) acts.push(`&lt;button data-mom=&quot;share&quot; data-txt=&quot;${esc(em+&quot; &quot;+title)}&quot;&gt;${esc(M.share)}&lt;/button&gt;`);
    acts.push(`&lt;button class=&quot;${base===&quot;kind&quot;?&quot;&quot;:&quot;primary&quot;}&quot; data-mom=&quot;ok&quot;&gt;${esc(M.ok)}&lt;/button&gt;`);
    $(&quot;momActs&quot;).innerHTML=acts.join(&quot;&quot;); $(&quot;moment&quot;).hidden=false; buzz(base===&quot;kind&quot;?8:[12,60,18]); setTimeout(()=&gt;$(&quot;momActs&quot;).querySelector(&quot;.primary&quot;)?.focus(),50); }
  function close(){ $(&quot;moment&quot;).hidden=true; setTimeout(next,300); }
  $(&quot;moment&quot;).addEventListener(&quot;click&quot;,e=&gt;{ const b=e.target.closest(&quot;[data-mom]&quot;); if(e.target===$(&quot;moment&quot;)) return close(); if(!b) return;
    const a=b.dataset.mom; close(); if(a===&quot;share&quot;) openShareWin(b.dataset.txt); else if(a===&quot;one&quot;) go(&quot;mission&quot;); });
  addEventListener(&quot;keydown&quot;,e=&gt;{ if(e.key===&quot;Escape&quot;&amp;&amp;!$(&quot;moment&quot;).hidden) close(); });
  return { scan:()=&gt;{ clearTimeout(timer); timer=setTimeout(scan,700); } };
})();

  function nextStep(){
    const done=(S.mission.checks[today()]||[]).filter(Boolean).length, P=profitNow();
    if(!S.mission.niche) return [T(&quot;Første skridt: vælg din niche, så kan resten af appen ramme dig bedre.&quot;,&quot;First step: pick your niche so the rest of the app fits you better.&quot;),[[&quot;restart&quot;,T(&quot;Vælg niche&quot;,&quot;Pick a niche&quot;)]]];

    if(!S.kanban.some(c=&gt;c.col!==&quot;posted&quot;)) return [T(&quot;Din pipeline er tom. Læg 3 idéer ind, så ved du altid, hvad næste video er.&quot;,&quot;Your pipeline is empty. Add 3 ideas so you always know your next video.&quot;),[[&quot;idea&quot;,T(&quot;+ Ny idé&quot;,&quot;+ New idea&quot;)]]];

    if(!S.profitGoal) return [T(`Du står på ${money(P.profit)} i profit denne måned. Sæt et profitmål, så viser appen, hvad du mangler pr. dag.`,`You&#x27;re at ${money(P.profit)} profit this month. Set a profit goal and the app shows what you need per day.`),[[&quot;profitgoal&quot;,T(&quot;Sæt profitmål&quot;,&quot;Set profit goal&quot;)]]];

  }

const D4 = (()=&gt;{
  const KEY=&quot;redhue_4d&quot;, reduce=matchMedia(&quot;(prefers-reduced-motion:reduce)&quot;);

    const root=document.documentElement.style;
    root.setProperty(&quot;--tx&quot;,tx.toFixed(3)); root.setProperty(&quot;--ty&quot;,ty.toFixed(3));

    for(const p of P){ p.z-=.0016; if(p.z&lt;=.02){ p.z=1; p.x=Math.random()*2-1; p.y=Math.random()*2-1; }
      const k=1/p.z, sx=W/2+(p.x*W*.5+tx*40)*k*.35, sy=H/2+(p.y*H*.5+ty*30)*k*.35;

    const phone=W&lt;700, home=current===&quot;home&quot;;
    // Telefon: bag uret på hjemmeskærmen, ellers lavt og dæmpet bag kortene. Computer: til højre.
    const S0=Math.min(W,H)*(phone?(home?.24:.3):.22), cxp=W*(phone?.5:.72)+tx*-26, cyp=H*(phone?(home?.15:.62):.46)+ty*-20, fade=phone&amp;&amp;!home?.45:1;
    const pts=V.map(v=&gt;{ const a=v.slice(); rot(a,0,3,t*.31); rot(a,1,3,t*.19+ty*.4); rot(a,2,3,t*.23); rot(a,0,1,t*.07+tx*.5);
      const w=1/(2.6-a[3]); const x=a[0]*w, y=a[1]*w, z=a[2]*w; const q=1/(2.8-z); return [cxp+x*q*S0*2.2, cyp+y*q*S0*2.2, a[3]]; });
    cx.lineWidth=1.1;

      cx.beginPath(); cx.moveTo(A[0],A[1]); cx.lineTo(B[0],B[1]); cx.stroke(); }

  function apply(){ const v=on(); document.documentElement.classList.toggle(&quot;d4&quot;,v); if(v) start(); else { stop(); cx.clearRect(0,0,W,H); [&quot;--tx&quot;,&quot;--ty&quot;].forEach(k=&gt;document.documentElement.style.setProperty(k,0)); } renderBtn(); }
  function renderBtn(){ const b=$(&quot;d4Btn&quot;); if(!b) return; b.textContent=on()?t().d4On:t().d4Off; b.classList.toggle(&quot;primary&quot;,on());
    $(&quot;d4Motion&quot;).hidden=!(on()&amp;&amp;typeof DeviceOrientationEvent!==&quot;undefined&quot;&amp;&amp;typeof DeviceOrientationEvent.requestPermission===&quot;function&quot;&amp;&amp;!haveTilt); }

    document.addEventListener(&quot;pointermove&quot;,e=&gt;{ if(!on()) return; const c=e.target.closest&amp;&amp;e.target.closest(&quot;#main .card&quot;); 
      document.querySelectorAll(&quot;#main .card.d4-tilt&quot;).forEach(x=&gt;{ if(x!==c) x.classList.remove(&quot;d4-tilt&quot;); });
      if(!c||c.offsetHeight&gt;520) return;
      if(!c.querySelector(&quot;:scope&gt;.d4-sheen&quot;)){ const s=document.createElement(&quot;i&quot;); s.className=&quot;d4-sheen&quot;; c.appendChild(s); }
      const r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;

      c.style.setProperty(&quot;--mx&quot;,(px*100).toFixed(1)+&quot;%&quot;); c.style.setProperty(&quot;--my&quot;,(py*100).toFixed(1)+&quot;%&quot;); c.classList.add(&quot;d4-tilt&quot;); },{passive:true});
    document.addEventListener(&quot;pointerleave&quot;,()=&gt;document.querySelectorAll(&quot;.card.d4-tilt&quot;).forEach(x=&gt;x.classList.remove(&quot;d4-tilt&quot;)));
  }
  addEventListener(&quot;resize&quot;,()=&gt;{ if(raf) size(); });
  document.addEventListener(&quot;visibilitychange&quot;,()=&gt;{ document.hidden?stop():start(); });
  reduce.addEventListener?.(&quot;change&quot;,apply);
  return { on, set, apply, enter, askMotion, renderBtn };
})();

async function roomFetch(){
  if(document.hidden) return;
  // Hver 6. gang (ca. 30 sek.) hentes hele rummet, så andres sletninger også forsvinder her
  const full = (chPolls++ % 6)===0;
  const since=(!full&amp;&amp;chRoom.length)?chRoom[chRoom.length-1].key:&quot;&quot;;
  try{
    const r=await fetch(CHAT_API+(since?&quot;?since=&quot;+encodeURIComponent(since):&quot;&quot;),{headers:{&quot;x-license&quot;:store.get(K.lic,&quot;&quot;)}});
    const j=await r.json().catch(()=&gt;({}));
    if(!r.ok){ if(r.status===402){ roomStop(); toast(t().errors.pro_required); } return; }
    if(full){ const fresh=j.messages||[]; const sig=a=&gt;JSON.stringify(a.map(m=&gt;[m.key,m.rx]));
      if(sig(fresh)!==sig(chRoom.slice(-fresh.length))||fresh.length!==Math.min(chRoom.length,60)){ chRoom=fresh; if(current===&quot;chat&quot;&amp;&amp;chTab===&quot;room&quot;) renderRoom(); }
      noteCheers(); return; }
    const seen=new Set(chRoom.map(m=&gt;m.key)); let added=false;
    (j.messages||[]).forEach(m=&gt;{ if(!seen.has(m.key)){ chRoom.push(m); added=true; } });
    if(added){ chRoom=chRoom.slice(-200); if(current===&quot;chat&quot;&amp;&amp;chTab===&quot;room&quot;) renderRoom(); }
  }catch{}
}
function roomStart(){ roomStop(); chPolls=0; roomFetch(); chRoomTimer=setInterval(roomFetch,5000); }
function roomStop(){ clearInterval(chRoomTimer); chRoomTimer=null; }

function monthSum(key){ const r=S.wallet.filter(w=&gt;String(w.date).slice(0,7)===key);
  const i=r.filter(x=&gt;x.type===&quot;in&quot;).reduce((a,x)=&gt;a+ +x.amount,0), o=r.filter(x=&gt;x.type===&quot;out&quot;).reduce((a,x)=&gt;a+ +x.amount,0);
  return {in:i,out:o,profit:i-o,margin:i?Math.round((i-o)/i*100):0}; }
function profitNow(){ return monthSum(today().slice(0,7)); }
function catShare(type,days){ const from=addDays(today(),-days), m={};
  S.wallet.filter(w=&gt;w.type===type &amp;&amp; String(w.date).slice(0,10)&gt;=from).forEach(w=&gt;{ m[w.cat||&quot;–&quot;]=(m[w.cat||&quot;–&quot;]||0)+ +w.amount; });
  return Object.entries(m).sort((a,b)=&gt;b[1]-a[1]); }
function shareHTML(list,color){ const tot=list.reduce((a,[,v])=&gt;a+v,0);
  return list.length? list.slice(0,6).map(([k,v])=&gt;`&lt;div class=&quot;r&quot; style=&quot;--c:${color}&quot;&gt;&lt;span&gt;${esc(k)}&lt;/span&gt;&lt;span class=&quot;mono&quot;&gt;${money(v)} · ${Math.round(v/tot*100)}%&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;&lt;i style=&quot;width:${Math.max(2,v/tot*100)}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;)
    : `&lt;div class=&quot;empty&quot;&gt;${t().pNone}&lt;/div&gt;`; }
function renderProfit(){
  const L=t(), td=today(), [y,mo,d]=td.split(&quot;-&quot;).map(Number), dim=new Date(y,mo,0).getDate();
  const M=monthly().map(m=&gt;({...m,profit:m.in-m.out})), now=M[M.length-1], last=M[M.length-2];
  const vs = last.profit ? Math.round((now.profit-last.profit)/Math.abs(last.profit)*100) : null;
  const forecast = Math.round(now.profit/d*dim);
  const margin = now.in? Math.round(now.profit/now.in*100) : 0;
  $(&quot;pKpis&quot;).innerHTML=[
    [money(now.profit), L.pThis, now.profit&lt;0?&quot;neg&quot;:&quot;pos&quot;, L.pVs(vs)],
    [money(last.profit), L.pLast, last.profit&lt;0?&quot;neg&quot;:&quot;&quot;, last.in?L.pMarginShort(Math.round(last.profit/last.in*100)):&quot;–&quot;],
    [now.in? margin+&quot;%&quot;:&quot;–&quot;, L.pMargin, margin&lt;0?&quot;neg&quot;:&quot;&quot;, `${money(now.in)} / −${money(now.out)}`],
    [money(forecast), L.pForecast, forecast&lt;0?&quot;neg&quot;:&quot;&quot;, `${d}/${dim}`]
  ].map(([v,l,c,s])=&gt;`&lt;div class=&quot;card kpi&quot;&gt;&lt;div class=&quot;v mono ${c}&quot;&gt;${v}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${l}&lt;/div&gt;&lt;div class=&quot;l mono&quot; style=&quot;margin-top:2px&quot;&gt;${s}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;);
  const mx=Math.max(1,...M.map(m=&gt;Math.abs(m.profit)));
  $(&quot;pBars&quot;).innerHTML=M.map((m,i)=&gt;`&lt;div class=&quot;pc ${i===M.length-1?&quot;now&quot;:&quot;&quot;}&quot;&gt;&lt;span class=&quot;v&quot;&gt;${m.profit?(m.profit&lt;0?&quot;−&quot;:&quot;&quot;)+String(abbr(Math.abs(Math.round(m.profit)))):&quot;0&quot;}&lt;/span&gt;&lt;div class=&quot;pb ${m.profit&lt;0?&quot;neg&quot;:m.profit===0?&quot;zero&quot;:&quot;&quot;}&quot; style=&quot;height:${Math.abs(m.profit)/mx*120}px&quot;&gt;&lt;/div&gt;&lt;span class=&quot;m&quot;&gt;${m.label}&lt;/span&gt;&lt;/div&gt;`).join(&quot;&quot;);
  $(&quot;pTable&quot;).innerHTML=`&lt;tr&gt;&lt;th&gt;${L.pMonth}&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;${L.pIn}&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;${L.pOut}&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;${L.profit}&lt;/th&gt;&lt;/tr&gt;`+
    [...M].reverse().map(m=&gt;`&lt;tr&gt;&lt;td style=&quot;text-transform:capitalize&quot;&gt;${m.label}&lt;/td&gt;&lt;td class=&quot;num mono&quot;&gt;${money(m.in,false)}&lt;/td&gt;&lt;td class=&quot;num mono&quot;&gt;${money(m.out,false)}&lt;/td&gt;&lt;td class=&quot;num mono ${m.profit&lt;0?&quot;neg&quot;:&quot;pos&quot;}&quot;&gt;${money(m.profit,false)}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;);
  const g=+S.profitGoal||0; $(&quot;pGoalIn&quot;).value=g||&quot;&quot;;
  if(!g){ $(&quot;pGoalTxt&quot;).textContent=L.pNoGoal; $(&quot;pGoalBar&quot;).style.width=&quot;0%&quot;; $(&quot;pGoalHint&quot;).textContent=&quot;&quot;; }
  else { const pc=Math.max(0,Math.min(100,Math.round(now.profit/g*100))), left=dim-d+1;
    $(&quot;pGoalTxt&quot;).textContent=`${money(now.profit)} / ${money(g)} · ${pc}%`; $(&quot;pGoalBar&quot;).style.width=pc+&quot;%&quot;;
    $(&quot;pGoalHint&quot;).textContent = now.profit&gt;=g ? L.pHit : L.pGapD(money(g-now.profit), left, money(Math.ceil((g-now.profit)/left))); }
  $(&quot;pSources&quot;).innerHTML=shareHTML(catShare(&quot;in&quot;,90),&quot;var(--ok)&quot;);
  $(&quot;pCosts&quot;).innerHTML=shareHTML(catShare(&quot;out&quot;,90),&quot;var(--red)&quot;);
}

function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,&quot;&lt;strong&gt;$1&lt;/strong&gt;&quot;).replace(/(^|\W)\*(.+?)\*(?=\W|$)/g,&quot;$1&lt;em&gt;$2&lt;/em&gt;&quot;); }
function md(src){
  const L=src.split(&quot;\n&quot;); let h=&quot;&quot;, list=null, i=0; const close=()=&gt;{ if(list){ h+=`&lt;/${list}&gt;`; list=null; } };
  const row=r=&gt;r.trim().replace(/^\||\|$/g,&quot;&quot;).split(&quot;|&quot;).map(c=&gt;c.trim());
  while(i&lt;L.length){ const l=L[i]; let m;
    if(/^\s*\|.*\|\s*$/.test(l) &amp;&amp; /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||&quot;&quot;)){ close();
      h+=&quot;&lt;table&gt;&lt;tr&gt;&quot;+row(l).map(c=&gt;`&lt;th&gt;${inl(c)}&lt;/th&gt;`).join(&quot;&quot;)+&quot;&lt;/tr&gt;&quot;; i+=2;
      while(i&lt;L.length &amp;&amp; /^\s*\|.*\|\s*$/.test(L[i])){ h+=&quot;&lt;tr&gt;&quot;+row(L[i]).map(c=&gt;`&lt;td&gt;${inl(c)}&lt;/td&gt;`).join(&quot;&quot;)+&quot;&lt;/tr&gt;&quot;; i++; }
      h+=&quot;&lt;/table&gt;&quot;; continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); h+=`&lt;h5&gt;${inl(m[1])}&lt;/h5&gt;`; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!==&quot;ul&quot;){ close(); h+=&quot;&lt;ul&gt;&quot;; list=&quot;ul&quot;; } h+=`&lt;li&gt;${inl(m[1])}&lt;/li&gt;`; }

}

  // Binær fil der er blevet &quot;tekst-konverteret&quot;: starter med U+FFFD + signatur (fx &quot;(U+FFFD)PNG&quot;)

  if(&quot;xp&quot; in st &amp;&amp; !Number.isFinite(+st.xp)){ st.xp=0; fixed++; } else if(&quot;xp&quot; in st) st.xp=+st.xp;

}
