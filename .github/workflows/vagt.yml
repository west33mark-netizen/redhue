# Vagt: hver halve time tjekkes det, om Netlify-nøglen virker.
# Så snart den gør, udgives gamma, beta, alpha og delta automatisk – og bagefter kun når der er noget nyt.
# Fejler aldrig selv (så du ikke får fejl-mails hver halve time); status står i loggen.
# Ligger på main, fordi GitHub kun kører tidsplaner fra hovedbranchen.
name: Vagt – udgiv når nøglen virker
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
jobs:
  vagt:
    runs-on: ubuntu-latest
    steps:
      - name: Tjek nøgle og udgiv det, der mangler
        env:
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: 3d54a324-e30b-443a-b89f-ba58d7fcc01f
          REPO: ${{ github.repository }}
        run: |
          T="$(printf %s "$RAW" | tr -d '[:space:]')"; echo "::add-mask::$T"
          case "$T" in nfp_*) ;; *) echo "Venter: NETLIFY_AUTH_TOKEN er ikke en gyldig Netlify-nøgle endnu (${#T} tegn)."; exit 0;; esac
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" "https://api.netlify.com/api/v1/sites/$SITE")
          [ "$code" = "200" ] || { echo "Venter: Netlify svarer $code på nøglen."; exit 0; }
          deploys=$(curl -s -H "Authorization: Bearer $T" "https://api.netlify.com/api/v1/sites/$SITE/deploys?per_page=30")
          for b in gamma beta alpha delta; do
            sha=$(gh api "repos/$REPO/commits/$b" --jq .sha 2>/dev/null || true); [ -n "$sha" ] || continue
            if printf %s "$deploys" | grep -q "$b $sha"; then echo "$b: allerede udgivet (${sha::7})"; continue; fi
            if gh run list --repo "$REPO" --workflow netlify.yml --branch "$b" --limit 1 --json status --jq '.[0].status' 2>/dev/null | grep -qE "queued|in_progress"; then echo "$b: udgives allerede"; continue; fi
            gh workflow run netlify.yml --repo "$REPO" --ref "$b" && echo "$b: udgivelse startet (${sha::7})"
          done
