# Daglig kontrol af at REDHUE kører. Fejler den, sender GitHub en mail til dig automatisk.
name: Daglig helbredstjek
on:
  schedule:
    - cron: "17 6 * * *"   # hver morgen ca. kl. 07–08 dansk tid
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tjek siden og serveren
        run: |
          fail=0
          chk(){ code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$1"); echo "$1 → $code (forventer $2)"; [ "$code" = "$2" ] || fail=1; }
          chk https://redhue.netlify.app/ 200
          chk https://redhue.netlify.app/sw.js 200
          chk https://redhue.netlify.app/manifest.json 200
          chk https://redhue.netlify.app/privatliv.html 200
          chk https://redhue.netlify.app/api/feedback 403
          chk https://redhue.netlify.app/api/chat 402
          chk https://beta--redhue.netlify.app/ 200
          chk https://redhue.netlify.app/api/health 200
          if [ $fail = 1 ]; then echo "::error title=REDHUE har et problem::Mindst én adresse svarede forkert – se listen ovenfor."; exit 1; fi
          echo "Alt kører ✓"
