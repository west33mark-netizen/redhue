# Lægger REDHUE live på Netlify (redhue.netlify.app), hver gang der pushes til branchen "redhue".
# Kræver én hemmelighed i GitHub: NETLIFY_AUTH_TOKEN (Netlify → User settings → Applications → Personal access tokens).
name: Deploy til Netlify
on:
  push:
    branches: [redhue]
  workflow_dispatch: {}
concurrency:
  group: netlify-prod
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 3d54a324-e30b-443a-b89f-ba58d7fcc01f
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Mangler nøgle?
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: |
          echo "::warning::NETLIFY_AUTH_TOKEN er ikke sat i repoets Secrets – springer deploy over."
      - uses: actions/setup-node@v4
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Installer
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npm ci
      - name: Deploy (produktion)
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli@latest deploy --build --prod --message "GitHub ${{ github.sha }}"
