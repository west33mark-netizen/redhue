# Flyt en version videre: alpha → beta (testere) → gamma (den færdige app) → delta (stabil reserve), eller det hele på én gang.
# Kør den fra GitHub → Actions → «Promovér» → Run workflow.
name: Promovér
on:
  workflow_dispatch:
    inputs:
      trin:
        description: "Hvad skal flyttes?"
        type: choice
        options: ["alpha → beta", "beta → gamma", "gamma → delta", "alt: alpha → beta → gamma → delta"]
        default: "alpha → beta"
permissions:
  contents: write
  actions: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Flyt
        env: { GH_TOKEN: "${{ github.token }}", TRIN: "${{ inputs.trin }}" }
        run: |
          case "$TRIN" in
            "alpha → beta") steps="alpha:beta";;
            "beta → gamma") steps="beta:gamma";;
            "gamma → delta") steps="gamma:delta";;
            *) steps="alpha:beta beta:gamma gamma:delta";;
          esac
          for st in $steps; do from=${st%%:*}; to=${st##*:}
            git fetch -q origin "$from"; git fetch -q origin "$to" 2>/dev/null || true
            if git rev-parse -q --verify "origin/$to" >/dev/null; then
              git checkout -q -B "$to" "origin/$to"
              if ! git merge -q --ff-only "origin/$from"; then echo "::error::$to har ændringer, som ikke er i $from. Ret det i $from først."; exit 1; fi
            else git checkout -q -B "$to" "origin/$from"; fi
            git push -q origin "$to"
            # Et push fra en workflow starter ikke andre workflows af sig selv – så vi starter udgivelsen direkte
            gh workflow run netlify.yml --ref "$to"
            echo "### $from → $to flyttet ($(git rev-parse --short HEAD)) og udgives nu" >> "$GITHUB_STEP_SUMMARY"
          done
